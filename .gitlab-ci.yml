variables:
  TARGET_BRANCH: "dev"
stages:
  - build
  - deploy

build_job:
  stage: build
  tags:
    - deploy
  script:
    - echo "빌드 작업을 시작합니다..."
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH

deploy_job:
  stage: deploy
  needs:
    - build_job
  tags:
    - deploy
  script:
    - echo "운영 서버 배포를 시작합니다..."
    - sudo pkill -f 'java' || true
    - sleep 5
    - nohup java -Dspring.profiles.active=dev -jar build/libs/*SNAPSHOT.jar > app.log 2>&1 &
    - echo "배포가 완료되었습니다!"
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH
