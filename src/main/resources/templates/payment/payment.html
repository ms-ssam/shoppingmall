<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제하기</title>
</head>
<body>
<h1>결제하기</h1>

<section>
    <p th:text="${order.mainProductName}">대표 상품명</p>
    <p>
        총 결제 금액 :
        <span th:text="${order.totalPaymentFee}">0</span> 원
    </p>
</section>

<div id="payment-method"></div>
<div id="agreement"></div>
<button id="pay-button">결제하기</button>

<script src="https://js.tosspayments.com/v2/standard"></script>

<script th:inline="javascript">
    const clientKey = /*[[${clientKey}]]*/ "";
    const customerKey = /*[[${customerKey}]]*/ "";
    const successUrl = /*[[${successUrl}]]*/ "";
    const failUrl = /*[[${failUrl}]]*/ "";

    const orderId = /*[[${order.orderId}]]*/ "";  // ✅ 이게 토스로 보내는 orderId

    const orderName = /*[[${order.mainProductName}]]*/ "주문";
    const amount = /*[[${order.totalPaymentFee}]]*/ 0;

    const tossPayments = TossPayments(clientKey);
    const widgets = tossPayments.widgets({ customerKey });

    async function renderWidget() {
        await widgets.setAmount({
            currency: "KRW",
            value: amount,
        });

        await Promise.all([
            widgets.renderPaymentMethods({
                selector: "#payment-method",
            }),
            widgets.renderAgreement({
                selector: "#agreement",
            })
        ]);
    }

    renderWidget();

    document.getElementById("pay-button").addEventListener("click", async () => {
        try {
            await widgets.requestPayment({
                orderId: orderId,  // orderCode 문자열
                orderName: orderName,
                successUrl: successUrl,
                failUrl: failUrl,
                customerEmail: /*[[${order.ordererEmail}]]*/ "",
                customerName: /*[[${order.ordererName}]]*/ ""
            });
        } catch (error) {
            console.error("requestPayment error:", error);
            alert(error.message + " (" + error.code + ")");
        }
    });
</script>
</body>
</html>
