<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>결제하기</title>
</head>
<body>
<h1>결제하기</h1>

<!-- 주문서로 돌아가기 버튼 -->
<div class="payment-header-actions">
    <button type="button"
            th:onclick="'location.href=\'/orders/' + ${order.id} + '/sheet\''">
        주문서로 돌아가기
    </button>
</div>

<section>
    <p th:text="${order.mainProductName}">대표 상품명</p>
    <p>
        총 결제 금액 :
        <span th:text="${order.totalPaymentFee}">0</span> 원
    </p>
</section>

<div id="payment-method"></div>
<div id="agreement"></div>
<button id="pay-button">결제하기</button>

<script src="https://js.tosspayments.com/v2/standard"></script>

<script th:inline="javascript">
    const clientKey = /*[[${clientKey}]]*/ "";
    const customerKey = /*[[${customerKey}]]*/ "";

    // 현재 브라우저가 보고 있는 도메인 기준으로 성공/실패 URL 생성
    const successUrl = window.location.origin + /*[[@{/payments/toss/success}]]*/ "";
    const failUrl = window.location.origin + /*[[@{/payments/toss/fail}]]*/ "";

    const orderId = /*[[${order.orderId}]]*/ "";  // 이게 토스로 보내는 orderId

    const orderName = /*[[${order.mainProductName}]]*/ "주문";
    const amount = /*[[${order.totalPaymentFee}]]*/ 0;

    const tossPayments = TossPayments(clientKey);
    const widgets = tossPayments.widgets({ customerKey });

    async function renderWidget() {
        await widgets.setAmount({
            currency: "KRW",
            value: amount,
        });

        await Promise.all([
            widgets.renderPaymentMethods({
                selector: "#payment-method",
            }),
            widgets.renderAgreement({
                selector: "#agreement",
            })
        ]);
    }

    renderWidget();

    document.getElementById("pay-button").addEventListener("click", async () => {
        try {
            await widgets.requestPayment({
                orderId: orderId,    // 문자열 주문번호
                orderName: orderName,
                successUrl: successUrl,
                failUrl: failUrl,
                customerEmail: /*[[${order.ordererEmail}]]*/ "",
                customerName: /*[[${order.ordererName}]]*/ ""
            });
        } catch (error) {
            console.error("requestPayment error:", error);

            // 1) 사용자가 결제창에서 취소한 경우
            if (error.code === "USER_CANCEL") {
                alert("결제를 취소했습니다.");
                // 👉 이 경우에는 결제 페이지에 그대로 남겨두면 됨
                return;
            }

            // 2) 진짜 오류인 경우
            alert("결제 처리 중 문제가 발생했습니다.\n잠시 후 다시 시도해 주세요.\n"
                + "(" + error.code + ")");

            // 옵션: 이 때 failUrl로 보내서 서버에서 로그/처리하고 싶다면
            /*
            const url = new URL(failUrl);
            url.searchParams.set("code", error.code);
            url.searchParams.set("message", error.message);
            url.searchParams.set("orderId", orderCode);
            window.location.href = url.toString();
            */
        }
    });
</script>
</body>
</html>
