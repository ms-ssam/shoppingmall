<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문서</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/order-sheet-complete.css}">
    <!--  다음 우편번호 스크립트 -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: topHeader(${cartCount})}"></div>

<main class="order-sheet-container">
    <h1 class="order-sheet-title">주문서</h1>

    <!-- 전체 주문 폼 -->
    <form th:action="@{/orders}" th:object="${orderCreateRequest}"
          method="post" class="order-form">
        <!-- DTO 검증 에러 안내 -->
        <div th:if="${#fields.hasErrors()}"
             class="alert alert-error global-error-box">
            입력하신 내용을 다시 확인해 주세요.
        </div>
        <!-- 비즈니스 에러 (재고 부족, 판매 중지 등) -->
        <div th:if="${errorMessage}"
             class="alert alert-error"
             th:text="${errorMessage}">
        </div>

        <!-- (선택) CSRF -->
        <!--
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        -->

        <!-- 배송지 정보 (주문서에서 입력) -->
        <section class="order-section-card">
            <header class="order-section-header">
                <h2 class="order-section-title">배송지 정보</h2>
            </header>
            <div class="order-section-body">
                <div class="form-row">
                    <label>수령인</label>
                    <input type="text" th:field="*{receiverName}"
                           th:classappend="${#fields.hasErrors('receiverName')} ? ' input-error' : ''"
                           placeholder="수령인 이름">
                    <div class="field-error"
                         th:if="${#fields.hasErrors('receiverName')}"
                         th:errors="*{receiverName}">
                    </div>
                </div>
                <div class="form-row">
                    <label>연락처</label>
                    <input type="text" th:field="*{receiverPhone}"
                           th:classappend="${#fields.hasErrors('receiverPhone')} ? ' input-error' : ''"
                           placeholder="연락 가능한 전화번호">
                    <div class="field-error"
                         th:if="${#fields.hasErrors('receiverPhone')}"
                         th:errors="*{receiverPhone}">
                    </div>
                </div>
                <div class="form-row">
                    <label>우편번호</label>
                    <div class="inline-group">
                        <!-- ✅ id/name/readonly 설정 -->
                        <input type="text" id="zipCode" name="zipCode"
                               th:classappend="${#fields.hasErrors('zipCode')} ? ' input-error' : ''"
                               readonly>
                        <!-- ✅ 버튼 클릭 시 주소 검색 팝업 -->
                        <button type="button"
                                class="btn btn-secondary"
                                onclick="execDaumPostcode()">
                            우편번호 찾기
                        </button>
                    </div>
                    <div class="field-error"
                         th:if="${#fields.hasErrors('zipCode')}"
                         th:errors="*{zipCode}">
                    </div>
                </div>
                <div class="form-row">
                    <label>주소</label>
                    <!-- ✅ id 추가 + readonly -->
                    <input type="text" id="address1" name="address1"
                           th:classappend="${#fields.hasErrors('address1')} ? ' input-error' : ''"
                           readonly>
                    <div class="field-error"
                         th:if="${#fields.hasErrors('address1')}"
                         th:errors="*{address1}">
                    </div>
                </div>
                <div class="form-row">
                    <label>상세 주소</label>
                    <!-- ✅ id 추가 -->
                    <input type="text" id="address2" name="address2"
                           th:classappend="${#fields.hasErrors('address2')} ? ' input-error' : ''">
                    <div class="field-error"
                         th:if="${#fields.hasErrors('address2')}"
                         th:errors="*{address2}">
                    </div>
                </div>
                <div class="form-row">
                    <label>배송 메모</label>
                    <textarea name="deliveryMemo"
                              th:field="*{deliveryMemo}"
                              placeholder="배송 시 요청사항을 입력해 주세요."
                              maxlength="100">
                    </textarea>
                    <div class="field-error"
                         th:if="${#fields.hasErrors('deliveryMemo')}"
                         th:errors="*{deliveryMemo}">
                    </div>
                </div>
            </div>
        </section>

        <!-- 주문 상품 정보 -->
        <section class="order-section-card">
            <header class="order-section-header">
                <h2 class="order-section-title">주문 상품</h2>
            </header>
            <div class="order-section-body">
                <table class="order-items-table">
                    <thead>
                    <tr>
                        <th>상품정보</th>
                        <th>옵션</th>
                        <th>수량</th>
                        <th>상품금액</th>
                        <th>합계</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${orderSheet.items}">
                        <td class="item-info">
                            <!-- 썸네일 -->
                            <img th:src="${item.thumbnailUrl}"
                                 alt="상품 이미지"
                                 class="item-thumb">

                            <!-- 상품명만 -->
                            <div class="item-text">
                                <div class="item-name"
                                     th:text="${item.productName}">상품명</div>
                            </div>
                        </td>

                        <!-- 옵션은 여기만 -->
                        <td th:text="${item.optionGroupName + ' / ' + item.optionDetailName}">
                            옵션명
                        </td>

                        <td th:text="${item.quantity}">1</td>

                        <td th:text="${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')} + '원'">
                            10,000원
                        </td>

                        <td th:text="${#numbers.formatInteger(item.subtotalPrice, 0, 'COMMA')} + '원'">
                            10,000원
                        </td>

                        <input type="hidden"
                               name="cartItemIds"
                               th:value="${item.cartItemId}">
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 결제 요약 / 결제수단 -->
        <section class="order-bottom-layout">
            <!-- 결제수단 -->
            <section class="order-section-card payment-method-card">
                <header class="order-section-header">
                    <h2 class="order-section-title">결제 수단</h2>
                </header>
                <div class="order-section-body">
                    <div class="payment-method-list">
                        <label class="radio-row">
                            <input type="radio" value="CARD" checked disabled>
                            <span>신용/체크카드</span>
                        </label>
                        <label class="radio-row">
                            <input type="radio" value="VBANK" disabled>
                            <span>가상계좌</span>
                        </label>
                        <label class="radio-row">
                            <input type="radio" value="TRANSFER" disabled>
                            <span>계좌이체</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- 결제 금액 요약 -->
            <section class="order-section-card payment-summary-card">
                <header class="order-section-header">
                    <h2 class="order-section-title">최종 결제 금액</h2>
                </header>
                <div class="order-section-body">
                    <dl class="price-row">
                        <dt>상품 합계</dt>
                        <!-- OrderSheetResponse.totalPrice -->
                        <dd th:text="${#numbers.formatInteger(orderSheet.totalPrice, 0, 'COMMA')} + '원'">
                            30,000원
                        </dd>
                    </dl>
                    <dl class="price-row">
                        <dt>배송비</dt>
                        <!-- OrderSheetResponse.deliveryFee -->
                        <dd th:text="${#numbers.formatInteger(orderSheet.deliveryFee, 0, 'COMMA')} + '원'">
                            3,000원
                        </dd>
                    </dl>
                    <dl class="price-row total">
                        <dt>총 결제 금액</dt>
                        <!-- OrderSheetResponse.finalPaymentAmount -->
                        <dd th:text="${#numbers.formatInteger(orderSheet.finalPaymentAmount, 0, 'COMMA')} + '원'">
                            33,000원
                        </dd>
                    </dl>

                    <div class="agreement-row">
                        <label>
                            <input type="checkbox" th:field="*{agreeTerms}">
                            주문 상품 정보 및 결제 대행 서비스 이용 약관에 모두 동의합니다.
                        </label>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('agreeTerms')}"
                             th:errors="*{agreeTerms}">
                        </div>
                    </div>

                    <div class="order-actions">
                        <!-- 장바구니 이동 버튼 -->
                        <button type="button"
                                class="btn btn-secondary btn-block"
                                onclick="location.href='/cart'">
                            장바구니로 돌아가기
                        </button>

                        <!-- 주문 생성 -->
                        <button type="submit"
                                class="btn btn-primary btn-block">
                            결제하기
                        </button>
                    </div>

                </div>
            </section>
        </section>
    </form>
</main>

<!-- ✅ 주소 검색 JS -->
<script>
    function execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function (data) {
                // 1. 우편번호
                document.getElementById('zipCode').value = data.zonecode;

                // 2. 기본 주소 (도로명 / 지번)
                let addr = '';
                if (data.userSelectedType === 'R') { // 도로명
                    addr = data.roadAddress;
                } else {                            // 지번
                    addr = data.jibunAddress;
                }
                document.getElementById('address1').value = addr;

                // 3. 상세 주소로 포커스 이동
                document.getElementById('address2').focus();
            }
        }).open();
    }
</script>

</body>
</html>
