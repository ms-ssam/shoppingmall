<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 완료</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/order-sheet-complete.css}">
</head>
<body>

<!-- 공통 헤더 -->
<div th:replace="~{fragments/header :: topHeader(${cartCount})}"></div>

<main class="order-complete-container">

    <section class="order-complete-card">
        <header class="order-complete-header">
            <h1 class="order-complete-title">주문이 완료되었습니다.</h1>
            <p class="order-complete-subtitle">
                이용해 주셔서 감사합니다. 주문 내역은 마이페이지 &gt; 주문 내역에서 다시 확인하실 수 있습니다.
            </p>
        </header>

        <!-- 주문 기본 정보 -->
        <section class="order-info-section">
            <dl class="order-info-list">
                <div class="order-info-row">
                    <dt>주문번호</dt>
                    <dd th:text="${order.id}">123456</dd>
                </div>
                <div class="order-info-row">
                    <dt>주문일자</dt>
                    <dd th:text="${#temporals.format(order.orderDate, 'yyyy.MM.dd HH:mm')}">
                        2025.12.09 15:30
                    </dd>
                </div>
                <div class="order-info-row">
                    <dt>주문자</dt>
                    <dd th:text="${order.ordererName}">홍길동</dd>
                </div>
                <div class="order-info-row">
                    <dt>결제 금액</dt>
                    <dd th:text="${#numbers.formatInteger(order.totalPaymentFee, 0, 'COMMA')} + '원'">
                        33,000원
                    </dd>
                </div>
                <div class="order-info-row">
                    <dt>결제 상태</dt>
                    <dd th:text="${order.paymentStatus}">COMPLETED</dd>
                </div>
            </dl>
        </section>

        <!-- 주문 상품 정보 -->
        <section class="order-main-product-section">
            <h2 class="section-title">주문 상품</h2>

            <div class="order-section-body">
                <table class="order-items-table">
                    <thead>
                    <tr>
                        <th>상품정보</th>
                        <th>옵션</th>
                        <th>수량</th>
                        <th>상품금액</th>
                        <th>합계</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Order.orderItems 사용 -->
                    <tr th:each="item : ${order.orderItems}">
                        <td class="item-info">
                            <!-- 썸네일 -->
                            <img th:src="${item.productThumbnailUrl}"
                                 alt="상품 이미지"
                                 class="item-thumb">

                            <!-- 상품명 -->
                            <div class="item-text">
                                <div class="item-name"
                                     th:text="${item.productName}">
                                    상품명
                                </div>
                            </div>
                        </td>

                        <!-- 옵션 (옵션그룹 / 옵션값) -->
                        <td th:text="${item.productOptionGroupName + ' / ' + item.optionDetail}">
                            옵션명
                        </td>

                        <td th:text="${item.quantity}">1</td>

                        <td th:text="${#numbers.formatInteger(item.unitPrice, 0, 'COMMA')} + '원'">
                            10,000원
                        </td>

                        <td th:text="${#numbers.formatInteger(item.subtotalPrice, 0, 'COMMA')} + '원'">
                            10,000원
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 배송지 요약 -->
        <section class="order-delivery-section">
            <h2 class="section-title">배송지 정보</h2>
            <dl class="order-info-list">
                <div class="order-info-row">
                    <dt>수령인</dt>
                    <dd th:text="${order.deliveryInfo.receiverName}">홍길동</dd>
                </div>
                <div class="order-info-row">
                    <dt>연락처</dt>
                    <dd th:text="${order.deliveryInfo.receiverPhone}">010-1234-5678</dd>
                </div>
                <div class="order-info-row">
                    <dt>주소</dt>
                    <dd>
                        <span th:text="'(' + ${order.deliveryInfo.zipCode} + ') '"></span>
                        <span th:text="${order.deliveryInfo.address1}"></span>
                        <span th:text="' ' + ${order.deliveryInfo.address2}"></span>
                    </dd>
                </div>
            </dl>
        </section>

        <!-- 버튼 영역 -->
        <div class="order-complete-actions">
            <button type="button"
                    class="btn btn-secondary"
                    onclick="location.href='/mypage/orders'">
                주문 내역 보기
            </button>
            <button type="button"
                    class="btn btn-primary"
                    onclick="location.href='/products'">
                쇼핑 계속하기
            </button>
        </div>
    </section>

</main>
</body>
</html>
