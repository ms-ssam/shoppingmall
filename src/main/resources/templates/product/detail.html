<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">상품 상세</title>

    <!-- 외부 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/product-detail.css}">
</head>
<body class="product-detail-page">

<div th:replace="fragments/header :: topHeader(${cartCount})"></div>

<div class="container">

    <!-- 상단 상품 영역 -->
    <div class="detail-wrap">

        <!-- 좌측 이미지 영역 -->
        <div class="left-col">
            <div class="swiper-container-main">
                <div class="swiper mySwiper2">
                    <div class="swiper-wrapper">
                        <th:block th:each="img : ${product.images}">
                            <div class="swiper-slide"
                                 th:if="${img.imageType.name() == 'MAIN' or img.imageType.name() == 'SLIDER'}">
                                <img th:src="${img.imageUrl}" alt="Product Image"
                                     onerror="this.src='https://via.placeholder.com/600x720?text=No+Image'">
                            </div>
                        </th:block>
                    </div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                </div>
            </div>

            <div class="swiper-container-thumbs">
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper">
                        <th:block th:each="img : ${product.images}">
                            <div class="swiper-slide"
                                 th:if="${img.imageType.name() == 'MAIN' or img.imageType.name() == 'SLIDER'}">
                                <img th:src="${img.imageUrl}" alt="Thumb"
                                     onerror="this.src='https://via.placeholder.com/100x120?text=No'">
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 상품 정보 영역 -->
        <div class="right-col">
            <div class="p-header">
                <h1 class="p-title" th:text="${product.name}">상품명</h1>

                <i class="bi wish-btn"
                   th:classappend="${product.liked} ? 'bi-heart-fill active' : 'bi-heart'"
                   th:onclick="|toggleWish(${product.id})|"></i>
            </div>

            <div class="rating-row">
                <span class="star"><i class="bi bi-star-fill"></i></span>
                <span th:text="${product.averageRating}">0.0</span>
                <span style="color:#ddd; margin:0 5px;">|</span>
                <span th:text="|${product.reviewCount}개 리뷰|">0개 리뷰</span>
            </div>

            <div class="price-area">
                <span class="price"
                      th:text="${#numbers.formatInteger(product.salePrice, 0, 'COMMA')} + '원'">0원</span>
                <span class="origin"
                      th:if="${product.discountRate > 0}"
                      th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">0원</span>
            </div>

            <ul class="info-list">
                <li th:text="${product.description}">상품 설명</li>
                <li>무료 배송 (50,000원 이상 구매 시)</li>
            </ul>

                <!-- 옵션 선택 -->
                <div class="opt-group">
                    <label class="opt-label">색상 선택</label>
                    <select id="colorSelect" class="opt-select" onchange="handleColorChange()">
                        <option value="">색상을 선택하세요</option>
                        <option th:each="group : ${product.optionGroups}"
                                th:value="${group.id}"
                                th:text="${group.name}">Color</option>
                    </select>
                </div>

                <!-- 사이즈 선택 (여기서 value가 optionDetailId가 되게) -->
                <div class="opt-group">
                    <label class="opt-label">사이즈</label>
                    <select id="sizeSelect" class="opt-select" disabled onchange="addOption()">
                        <option value="">먼저 색상을 선택하세요</option>
                    </select>
                </div>

                <!-- 선택된 옵션 목록 -->
                <div id="selected-options"></div>

                <!-- 총 금액 -->
                <div class="total-box">
                    <span class="total-label">Total</span>
                    <span class="total-price" id="totalPrice">0원</span>
                </div>

                <!-- 장바구니 / 구매 버튼 -->
                <div class="btn-row">
                    <!-- 장바구니 폼 -->
                    <form th:action="@{|/products/${product.id}/cart|}" method="post" id="cartForm">
                        <!-- 장바구니 hidden 필드 -->
                        <div id="cart-hidden-fields"></div>
                        <button type="submit" class="btn btn-cart">장바구니</button>
                    </form>
                    <!--  구매하기 폼: 장바구니에 담고 바로 장바구니로 이동 -->
                    <form th:action="@{|/products/${product.id}/purchase|}" method="post" id="buyNowForm">
                        <div id="buy-hidden-fields"></div>
                        <button type="submit" class="btn btn-buy">구매하기</button>
                    </form>
                </div>
        </div>
    </div>

    <!-- 탭 메뉴 -->
    <ul class="tab-menu">
        <li class="tab-item active" data-target="detail">상세정보</li>
        <li class="tab-item" data-target="review">
            구매후기 (<span th:text="${product.reviewCount}">0</span>)
        </li>
        <li class="tab-item" data-target="qna">상품문의</li>
    </ul>

    <!-- 상세 이미지 영역 (상세정보 탭) -->
    <div id="tab-detail" class="detail-content tab-content active">
        <div class="desc-list-wrap" id="descListWrap">
            <th:block th:each="img : ${product.images}">
                <div class="desc-img-item" th:if="${img.imageType.name() == 'DESCRIPTION'}">
                    <img th:src="${img.imageUrl}" class="desc-img" alt="Detail Info"
                         onerror="this.src='https://via.placeholder.com/860x1000?text=Detail+Image'">
                </div>
            </th:block>

            <div th:if="${product.images.isEmpty()}" style="padding:50px; color:#999;">
                상세 이미지가 없습니다.
            </div>
        </div>

        <div class="more-btn-area">
            <button class="btn-more" onclick="toggleDesc()">
                상세 정보 더보기 <i class="bi bi-chevron-down"></i>
            </button>
        </div>
    </div>

    <!-- ✅ 구매 후기 리스트 영역 (구매후기 탭) -->
    <div id="tab-review" class="review-section tab-content">
        <div class="review-header">
            <div class="review-title">구매후기</div>
            <div class="review-count">
                총 <span th:text="${product.reviewCount}">0</span>개
            </div>
        </div>

        <!-- 리뷰가 하나도 없을 때 -->
        <div class="review-empty" th:if="${#lists.isEmpty(reviews)}">
            아직 작성된 구매후기가 없습니다.
        </div>

        <!-- 리뷰가 있을 때 -->
        <div th:if="${!#lists.isEmpty(reviews)}">
            <div th:each="review : ${reviews}" class="review-item">
                <div class="review-meta">
                    <span th:text="${review.member.nickname}">닉네임</span>
                    <span th:text="${#temporals.format(review.createdAt, 'yyyy.MM.dd')}">2025.01.01</span>
                </div>

                <div class="review-rating">
                    <span th:each="i : ${#numbers.sequence(1, 5)}">
                        <i class="bi"
                           th:classappend="${i <= review.rating} ? ' bi-star-fill' : ' bi-star'">
                        </i>
                    </span>
                </div>

                <div class="review-content" th:text="${review.content}">
                    리뷰 내용입니다.
                </div>

                <div class="review-image" th:if="${review.imageUrl != null}">
                    <img th:src="${review.imageUrl}"
                         alt="리뷰 이미지"
                         onerror="this.src='https://via.placeholder.com/160x160?text=No+Image'">
                </div>
            </div>
        </div>
    </div>
    <!-- ✅ 구매 후기 리스트 영역 끝 -->

    <!-- ✅ 상품 문의 영역 (상품문의 탭) -->
    <div id="tab-qna" class="qna-section tab-content">
        <div class="review-header">
            <div class="review-title">상품문의</div>
        </div>

        <!-- 추후 문의 리스트 붙이기 전까지는 기본 문구 -->
        <div class="review-empty">
            등록된 상품 문의가 없습니다.
        </div>
    </div>

</div> <!-- /.container -->

<!-- 장바구니 추가 완료 모달 -->
<div id="cart-added-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
        <p>장바구니에 담았습니다.</p>
        <div class="modal-actions">
            <button type="button" id="btn-continue-shopping">계속 쇼핑</button>
            <button type="button" id="btn-go-cart">장바구니 가기</button>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<!-- Thymeleaf에서 JS로 값 넘겨주는 최소 스크립트 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    window.optionGroups = /*[[${product.optionGroups}]]*/ [];
    window.basePrice = /*[[${product.salePrice}]]*/ 0;
    /*]]>*/
</script>

<!-- 분리한 JS 파일 -->
<script th:src="@{/js/product-detail.js}"></script>

</body>
</html>
