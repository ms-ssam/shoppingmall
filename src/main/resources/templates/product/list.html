<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/product/user/list.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>

<div th:replace="fragments/header :: topHeader(${cartCount})"></div>

<div class="container">

    <div class="category-tabs">
        <a th:href="@{/products}"
           class="tab-item"
           th:classappend="${categoryId == null} ? 'active'">전체</a>

        <a th:each="cat : ${categoryTree}"
           th:href="@{/products(categoryId=${cat.id})}"
           class="tab-item"
           th:text="${cat.name}"
           th:classappend="${categoryId == cat.id or (cat.children != null and #lists.contains(cat.children.![id], categoryId))} ? 'active'">
            상의
        </a>
    </div>

    <div class="sub-categories" th:if="${subCategories != null and !subCategories.isEmpty()}">
        <a th:each="sub : ${subCategories}"
           th:href="@{/products(categoryId=${sub.id}, sortType=${sortType})}"
           class="pill-btn"
           th:text="${sub.name}"
           th:classappend="${categoryId == sub.id} ? 'active'">
            티셔츠
        </a>
    </div>

    <div class="list-info">
        <span class="total-cnt" th:text="|총 ${products.totalElements}개 상품|">총 0개 상품</span>

        <select class="sort-sel" id="sortSelect" onchange="changeSort()">
            <option value="LATEST" th:selected="${sortType.name() == 'LATEST'}">최신순</option>
            <option value="PRICE_HIGH" th:selected="${sortType.name() == 'PRICE_HIGH'}">가격 높은순</option>
            <option value="PRICE_LOW" th:selected="${sortType.name() == 'PRICE_LOW'}">가격 낮은순</option>
            <option value="REVIEW_COUNT" th:selected="${sortType.name() == 'REVIEW_COUNT'}">리뷰 많은순</option>
            <option value="WISHLIST_COUNT" th:selected="${sortType.name() == 'WISHLIST_COUNT'}">찜 많은순</option>
            <option value="RATING" th:selected="${sortType.name() == 'RATING'}">평점 높은순</option>
        </select>
    </div>

    <div class="grid">
        <div th:if="${products.isEmpty()}" class="no-data">
            등록된 상품이 없습니다.
        </div>

        <div class="card" th:each="product : ${products.content}">

            <div class="img-box"
                 th:onclick="|location.href='@{/products/{id}(id=${product.id})}'|">
                <img th:src="${product.mainImageUrl} ?: '/images/default.jpg'"
                     alt="Product Image">
            </div>

            <div class="wish-icon"
                 th:classappend="${product.liked} ? 'active'"
                 th:onclick="|toggleWish(event, ${product.id})|">
                <i th:class="${product.liked} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
            </div>

            <div class="title" th:text="${product.name}"
                 th:onclick="|location.href='@{/products/{id}(id=${product.id})}'|">상품명</div>

            <div class="price-row">
                <span class="discount-rate"
                      th:if="${product.discountRate > 0}"
                      th:text="${product.discountRate} + '%'">10%</span>

                <span class="sale"
                      th:text="${#numbers.formatInteger(product.salePrice, 0, 'COMMA')} + '원'">28,000원</span>

                <span class="origin"
                      th:if="${product.discountRate > 0}"
                      th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">35,000원</span>
            </div>

            <div class="meta">
                <span>
                    <i class="bi bi-star-fill star"></i>
                    <span th:text="${product.averageRating}">0.0</span>
                    (<span th:text="${product.reviewCount > 999 ? '999+' : product.reviewCount}">0</span>)
                 </span>
                <span>
                    <i class="bi bi-heart-fill" style="color:#ccc; font-size:10px;"></i>
                    <span th:text="${product.wishListCount > 999 ? '999+' : product.wishListCount}">0</span>
                </span>
            </div>

        </div>
    </div>

</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const currentCategoryId = /*[[${categoryId}]]*/ null;
    /*]]>*/

    // 정렬 변경 함수
    function changeSort() {
        const sortType = document.getElementById('sortSelect').value;
        let url = '/products?sortType=' + sortType;

        // 현재 카테고리가 있다면 URL에 포함 (필터 유지)
        if (currentCategoryId) {
            url += '&categoryId=' + currentCategoryId;
        }
        location.href = url;
    }

    // 찜 토글 함수
    function toggleWish(event, productId) {
        event.stopPropagation(); // 카드 클릭 이동 방지

        const iconBox = event.currentTarget;
        const icon = iconBox.querySelector('i');
        const isActive = iconBox.classList.contains('active');

        const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");

        const method = isActive ? 'DELETE' : 'POST';
        const url = isActive ? `/api/products/${productId}/wish` : `/api/products/${productId}/wishList`;

        const headers = { 'Content-Type': 'application/json' };
        if (csrfHeader && csrfToken) {
            headers[csrfHeader] = csrfToken;
        }

        fetch(url, { method: method, headers: headers })
            .then(response => {
                if (response.ok) {
                    iconBox.classList.toggle('active');
                    if (isActive) {
                        icon.className = 'bi bi-heart';
                    } else {
                        icon.className = 'bi bi-heart-fill';
                    }
                } else if (response.status === 401) {
                    if(confirm('로그인이 필요한 서비스입니다. 로그인 하시겠습니까?')) {
                        location.href = '/login';
                    }
                } else {
                    alert('오류가 발생했습니다.');
                }
            })
            .catch(error => console.error('Error:', error));
    }
    // 이미지 처리
    function setupImageErrorHandling() {
        document.querySelectorAll('img').forEach(img => {
            if (!img.dataset.errorBound) {
                img.dataset.errorBound = 'true';
                img.addEventListener('error', handleImageError);
            }
        });
    }

    function handleImageError(event) {
        const img = event.target;
        if (!img.dataset.errorHandled) {
            img.dataset.errorHandled = 'true';
            img.src = '/images/default.jpg';
            img.alt = '이미지를 불러올 수 없습니다';
        }
    }

    document.addEventListener('DOMContentLoaded', setupImageErrorHandling);
</script>

</body>
</html>
