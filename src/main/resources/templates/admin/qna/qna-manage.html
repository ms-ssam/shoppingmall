<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::div})}">
<head>
</head>
<body>

<div class="w-full">

    <div class="bg-white rounded-lg shadow-sm border border-gray-200">

        <div class="p-6 border-b border-gray-100 flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold text-gray-800">1:1 문의 목록</h2>
                <p class="text-sm text-gray-500 mt-1">고객의 문의 사항을 확인하고 관리합니다.</p>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left text-gray-500">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b whitespace-nowrap">
                <tr>
                    <th scope="col" class="px-6 py-4 w-16 text-center">No</th>
                    <th scope="col" class="px-6 py-4 w-28 text-center">상태</th>
                    <th scope="col" class="px-6 py-4 w-48">상품명</th>
                    <th scope="col" class="px-6 py-4">제목</th>
                    <th scope="col" class="px-6 py-4 w-32">작성자</th>
                    <th scope="col" class="px-6 py-4 w-40 text-center">작성일</th>
                    <th scope="col" class="px-6 py-4 w-20 text-center">비밀글</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${questions.isEmpty()}">
                    <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                        <div class="flex flex-col items-center justify-center gap-2">
                            <i class="bi bi-inbox text-4xl text-gray-300"></i>
                            <p>등록된 문의 내역이 없습니다.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="q : ${questions}" class="bg-white border-b hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 text-center font-medium text-gray-900" th:text="${q.id}">1</td>

                    <td class="px-6 py-4 text-center whitespace-nowrap">
                            <span th:if="${q.isAnswered}"
                                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 border border-green-200">
                                답변완료
                            </span>
                        <span th:unless="${q.isAnswered}"
                              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 border border-red-200">
                                답변대기
                            </span>
                    </td>

                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900 truncate max-w-[12rem]"
                             th:text="${q.product.name}" title="${q.product.name}">상품이름</div>
                    </td>

                    <td class="px-6 py-4">
                        <a th:href="@{/admin/inquiries/{id}(id=${q.id})}"
                           class="group flex items-center gap-1 max-w-md text-gray-900 font-medium hover:text-blue-600">
                            <span th:text="${q.title}" class="truncate group-hover:underline">문의 제목입니다</span>
                            <i th:if="${q.isSecret}" class="bi bi-lock-fill text-gray-400 text-xs flex-shrink-0" title="비밀글"></i>
                        </a>
                    </td>

                    <td class="px-6 py-4 whitespace-nowrap" th:text="${q.member.nickname}">홍길동</td>

                    <td class="px-6 py-4 text-center text-gray-500 whitespace-nowrap"
                        th:text="${#temporals.format(q.createdAt, 'yyyy-MM-dd HH:mm')}">2023-12-10</td>

                    <td class="px-6 py-4 text-center whitespace-nowrap">
                        <i th:if="${q.isSecret}" class="bi bi-shield-lock text-gray-400 text-lg" title="비공개"></i>
                        <i th:unless="${q.isSecret}" class="bi bi-globe text-gray-300 text-lg" title="공개"></i>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6"
             th:if="${!questions.isEmpty()}">

            <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm text-gray-700">
                        전체 <span class="font-bold" th:text="${questions.totalElements}">10</span>건 중
                        <span class="font-medium" th:text="${questions.number * questions.size + 1}">1</span> -
                        <span class="font-medium" th:text="${questions.numberOfElements + (questions.number * questions.size)}">10</span>
                    </p>
                </div>
                <div>
                    <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
                        <a th:href="@{/admin/inquiries(page=${questions.number - 1})}"
                           th:classappend="${questions.first} ? 'pointer-events-none opacity-50 bg-gray-50' : 'hover:bg-gray-50'"
                           class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Previous</span>
                            <i class="bi bi-chevron-left"></i>
                        </a>

                        <th:block th:each="page : ${#numbers.sequence(0, questions.totalPages - 1)}">
                            <a th:if="${page >= questions.number - 2 and page <= questions.number + 2}"
                               th:href="@{/admin/inquiries(page=${page})}"
                               th:text="${page + 1}"
                               th:classappend="${page == questions.number} ? 'z-10 bg-black text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-600' : 'text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50'"
                               class="relative inline-flex items-center px-4 py-2 text-sm font-semibold focus:z-20">1</a>
                        </th:block>

                        <a th:href="@{/admin/inquiries(page=${questions.number + 1})}"
                           th:classappend="${questions.last} ? 'pointer-events-none opacity-50 bg-gray-50' : 'hover:bg-gray-50'"
                           class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Next</span>
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
