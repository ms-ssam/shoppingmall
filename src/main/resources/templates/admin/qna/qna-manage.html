<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::div})}">
<head>
</head>
<body>

<div class="w-full">

    <div class="bg-white rounded-lg shadow-sm border border-gray-200">

        <!-- 헤더 -->
        <div class="p-6 border-b border-gray-100">
            <h2 class="text-xl font-bold text-gray-800">1:1 문의 목록</h2>

            <!-- 검색 / 필터 바 -->
            <form th:action="@{/admin/inquiries}" method="get"
                  class="mt-4 flex items-center gap-3 w-full">

                <!-- 답변 여부 -->
                <div class="flex items-center gap-2 flex-shrink-0">
                    <label for="answered" class="text-sm text-gray-600 whitespace-nowrap">
                        답변 여부
                    </label>
                    <select id="answered" name="answered"
                            class="h-10 w-28 rounded-md border border-gray-300 bg-white px-3 text-sm text-gray-700
                       focus:outline-none focus:ring-2 focus:ring-black/20">
                        <option value=""
                                th:selected="${condition == null or condition.answered == null}">
                            전체
                        </option>
                        <option value="true"
                                th:selected="${condition != null and condition.answered == true}">
                            답변완료
                        </option>
                        <option value="false"
                                th:selected="${condition != null and condition.answered == false}">
                            답변대기
                        </option>
                    </select>
                </div>

                <!-- 상품명 (가로 전체 차지 핵심) -->
                <div class="flex items-center gap-2 flex-1 min-w-0">
                    <label for="productName" class="text-sm text-gray-600 whitespace-nowrap">
                        상품명
                    </label>

                    <div class="relative flex-1">
                        <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input id="productName"
                               name="productName"
                               type="text"
                               th:value="${condition != null ? condition.productName : ''}"
                               placeholder="상품명으로 검색"
                               class="h-10 w-full rounded-md border border-gray-300 pl-10 pr-3 text-sm
                          text-gray-800 placeholder-gray-400
                          focus:outline-none focus:ring-2 focus:ring-black/20"/>
                    </div>
                </div>

                <!-- 검색 버튼 -->
                <button type="submit"
                        class="h-10 flex-shrink-0 inline-flex items-center gap-2 rounded-md
                   bg-black px-4 text-sm font-semibold text-white hover:bg-gray-800">
                    <i class="bi bi-funnel"></i>
                    검색
                </button>

                <!-- 초기화 -->
                <a th:href="@{/admin/inquiries}"
                   class="h-10 flex-shrink-0 inline-flex items-center gap-2 rounded-md
              border border-gray-300 bg-white px-4 text-sm font-semibold
              text-gray-700 hover:bg-gray-50">
                    <i class="bi bi-arrow-counterclockwise"></i>
                    초기화
                </a>
            </form>
        </div>
    </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left text-gray-500">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b whitespace-nowrap">
                <tr>
                    <th scope="col" class="px-6 py-4 w-16 text-center">No</th>
                    <th scope="col" class="px-6 py-4 w-28 text-center">상태</th>
                    <th scope="col" class="px-6 py-4 w-48">상품명</th>
                    <th scope="col" class="px-6 py-4">제목</th>
                    <th scope="col" class="px-6 py-4 w-32">작성자</th>
                    <th scope="col" class="px-6 py-4 w-40 text-center">작성일</th>
                    <th scope="col" class="px-6 py-4 w-20 text-center">비밀글</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${questions.isEmpty()}">
                    <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                        <div class="flex flex-col items-center justify-center gap-2">
                            <i class="bi bi-inbox text-4xl text-gray-300"></i>
                            <p>등록된 문의 내역이 없습니다.</p>
                        </div>
                    </td>
                </tr>

                <tr th:each="q : ${questions}"
                    class="bg-white border-b hover:bg-gray-50 transition-colors">

                    <!-- No -->
                    <td class="px-6 py-4 text-center font-medium text-gray-900"
                        th:text="${q.id}">1</td>

                    <!-- 상태 -->
                    <td class="px-6 py-4 text-center whitespace-nowrap">
                        <span th:if="${q.answered}"
                              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs
                                     font-medium bg-green-100 text-green-800 border border-green-200">
                            답변완료
                        </span>
                        <span th:unless="${q.answered}"
                              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs
                                     font-medium bg-red-100 text-red-800 border border-red-200">
                            답변대기
                        </span>
                    </td>

                    <!-- 상품명 -->
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900 truncate max-w-[12rem]"
                             th:text="${q.product.name}">
                            상품이름
                        </div>
                    </td>

                    <!-- 제목 (폭 줄이고 말줄임 + 자물쇠 아이콘) -->
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2 max-w-[26rem]">
                            <span th:text="${q.title}"
                                  class="truncate font-medium text-gray-900">
                                문의 제목입니다
                            </span>
                            <i th:if="${q.secret}"
                               class="bi bi-lock-fill text-gray-400 text-xs"
                               title="비밀글"></i>
                        </div>
                    </td>

                    <!-- 작성자 -->
                    <td class="px-6 py-4 whitespace-nowrap"
                        th:text="${q.member.nickname}">
                        홍길동
                    </td>

                    <!-- 작성일 -->
                    <td class="px-6 py-4 text-center text-gray-500 whitespace-nowrap"
                        th:text="${#temporals.format(q.createdAt, 'yyyy-MM-dd HH:mm')}">
                        2023-12-10
                    </td>

                    <!-- 비밀글 여부 명확 표시 -->
                    <td class="px-6 py-4 text-center whitespace-nowrap">
                        <span th:if="${q.secret}"
                              class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full
                                     text-xs font-semibold bg-gray-100 text-gray-800 border border-gray-200">
                            <i class="bi bi-shield-lock"></i>
                            비밀
                        </span>
                        <span th:unless="${q.secret}"
                              class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full
                                     text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
                            <i class="bi bi-globe"></i>
                            공개
                        </span>
                    </td>

                    <!-- 문의 상세 이동 -->
                    <td class="px-6 py-4 text-center whitespace-nowrap">
                        <a th:href="@{/admin/inquiries/{id}(id=${q.id})}"
                           class="inline-flex items-center gap-2 rounded-md
                                  border border-gray-300 bg-white px-3 py-2
                                  text-xs font-semibold text-gray-700 hover:bg-gray-50">
                            <i class="bi bi-box-arrow-up-right"></i>
                            상세
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- ✅ 페이징(검색 조건 유지) -->
        <div class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6"
             th:if="${!questions.isEmpty()}">

            <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                <div>
                    <p class="text-sm text-gray-700">
                        전체 <span class="font-bold" th:text="${questions.totalElements}">10</span>건 중
                        <span class="font-medium" th:text="${questions.number * questions.size + 1}">1</span> -
                        <span class="font-medium"
                              th:text="${questions.numberOfElements + (questions.number * questions.size)}">10</span>
                    </p>
                </div>

                <div>
                    <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">

                        <!-- 이전 -->
                        <a th:href="@{/admin/inquiries(
                                    page=${questions.number - 1},
                                    answered=${condition != null ? condition.answered : null},
                                    productName=${condition != null ? condition.productName : null}
                                 )}"
                           th:classappend="${questions.first} ? 'pointer-events-none opacity-50 bg-gray-50' : 'hover:bg-gray-50'"
                           class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Previous</span>
                            <i class="bi bi-chevron-left"></i>
                        </a>

                        <!-- 페이지 번호 -->
                        <th:block th:each="page : ${#numbers.sequence(0, questions.totalPages - 1)}">
                            <a th:if="${page >= questions.number - 2 and page <= questions.number + 2}"
                               th:href="@{/admin/inquiries(
                                            page=${page},
                                            answered=${condition != null ? condition.answered : null},
                                            productName=${condition != null ? condition.productName : null}
                                         )}"
                               th:text="${page + 1}"
                               th:classappend="${page == questions.number}
                                    ? 'z-10 bg-black text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-600'
                                    : 'text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50'"
                               class="relative inline-flex items-center px-4 py-2 text-sm font-semibold focus:z-20">1</a>
                        </th:block>

                        <!-- 다음 -->
                        <a th:href="@{/admin/inquiries(
                                    page=${questions.number + 1},
                                    answered=${condition != null ? condition.answered : null},
                                    productName=${condition != null ? condition.productName : null}
                                 )}"
                           th:classappend="${questions.last} ? 'pointer-events-none opacity-50 bg-gray-50' : 'hover:bg-gray-50'"
                           class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 focus:z-20 focus:outline-offset-0">
                            <span class="sr-only">Next</span>
                            <i class="bi bi-chevron-right"></i>
                        </a>

                    </nav>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
