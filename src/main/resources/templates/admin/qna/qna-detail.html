<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(~{::div})}">
<head></head>
<body>

<div class="w-full">

    <div class="bg-white rounded-lg shadow-sm border border-gray-200">

        <!-- 헤더 -->
        <div class="p-6 border-b border-gray-100">
            <div class="flex items-start justify-between gap-4 flex-wrap">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">문의 상세</h2>
                    <!-- 원하면 멘트 제거 가능 -->
                    <p class="mt-1 text-sm text-gray-500">
                        문의 내용과 답변 상태를 확인하고 답변을 등록할 수 있습니다.
                    </p>
                </div>

                <div class="flex items-center gap-2">
                    <a th:href="@{/admin/inquiries}"
                       class="h-10 inline-flex items-center gap-2 rounded-md border border-gray-300 bg-white px-4
                              text-sm font-semibold text-gray-700 hover:bg-gray-50">
                        <i class="bi bi-list"></i>
                        목록
                    </a>

                    <!-- 상태 배지 -->
                    <span th:if="${question.answered}"
                          class="h-10 inline-flex items-center px-3 rounded-md text-sm font-semibold
                                 bg-green-50 text-green-700 border border-green-200">
                        <i class="bi bi-check2-circle mr-2"></i>
                        답변완료
                    </span>
                    <span th:unless="${question.answered}"
                          class="h-10 inline-flex items-center px-3 rounded-md text-sm font-semibold
                                 bg-red-50 text-red-700 border border-red-200">
                        <i class="bi bi-clock-history mr-2"></i>
                        답변대기
                    </span>
                </div>
            </div>
        </div>

        <!-- 본문 -->
        <div class="p-6 space-y-6">

            <!-- 상단 정보 카드 -->
            <section class="rounded-lg border border-gray-200 bg-white">
                <div class="p-5 flex items-start justify-between gap-6 flex-wrap">
                    <!-- 왼쪽: 상품/작성자 -->
                    <div class="space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold text-gray-500">문의번호</span>
                            <span class="text-sm font-bold text-gray-900" th:text="${question.id}">1</span>
                        </div>

                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold text-gray-500">상품명</span>
                            <span class="text-sm font-semibold text-gray-900"
                                  th:text="${question.product != null ? question.product.name : '-'}">
                                상품명
                            </span>
                        </div>

                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold text-gray-500">작성자</span>
                            <span class="text-sm text-gray-900"
                                  th:text="${question.member != null ? question.member.nickname : '-'}">
                                작성자
                            </span>
                        </div>
                    </div>

                    <!-- 오른쪽: 작성일/비밀글 -->
                    <div class="space-y-3 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <span class="text-xs font-semibold text-gray-500">작성일</span>
                            <span class="text-sm text-gray-900"
                                  th:text="${#temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}">
                                2025-12-13 19:19
                            </span>
                        </div>

                        <div class="flex items-center justify-end gap-2">
                            <span class="text-xs font-semibold text-gray-500">비밀글</span>

                            <!-- 비밀글 뱃지 -->
                            <span th:if="${question.secret}"
                                  class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold
                                         bg-gray-100 text-gray-800 border border-gray-200">
                                <i class="bi bi-shield-lock"></i>
                                비밀
                            </span>
                            <span th:unless="${question.secret}"
                                  class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold
                                         bg-blue-50 text-blue-700 border border-blue-200">
                                <i class="bi bi-globe"></i>
                                공개
                            </span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Q / A 카드 -->
            <section class="rounded-lg border border-gray-200 bg-white">
                <div class="p-5">

                    <!-- Q -->
                    <div class="flex items-start gap-4">
                        <div class="flex-shrink-0 w-10 h-10 rounded-full bg-gray-900 text-white
                                    flex items-center justify-center font-bold">
                            Q
                        </div>

                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <h3 class="text-base font-bold text-gray-900 truncate"
                                    th:text="${question.title}">
                                    문의 제목
                                </h3>
                                <i th:if="${question.secret}" class="bi bi-lock-fill text-gray-400" title="비밀글"></i>
                            </div>

                            <p class="mt-2 text-sm text-gray-700 leading-relaxed whitespace-pre-line"
                               th:text="${question.content}">
                                문의 내용
                            </p>
                        </div>
                    </div>

                    <!-- 구분선 -->
                    <hr class="my-5 border-gray-100">

                    <!-- A (답변이 있는 경우) -->
                    <div th:if="${question.answered and question.answer != null}"
                         class="flex items-start gap-4">

                        <div class="flex-shrink-0 w-10 h-10 rounded-full bg-blue-600 text-white
                                    flex items-center justify-center font-bold">
                            A
                        </div>

                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-bold text-gray-900">
                                판매자 답변
                                <span th:if="${question.answer.admin.nickname != null}"
                                      class="ml-1 text-xs font-medium text-gray-500"
                                      th:text="'(판매자) ' + ${question.answer.admin.nickname} ">
                                    (관리자)
                                </span>
                            </h4>

                            <p class="mt-2 text-sm text-gray-700 leading-relaxed whitespace-pre-line"
                               th:text="${question.answer.content}">
                                답변 내용
                            </p>
                        </div>
                    </div>

                    <!-- A (답변이 없는 경우) -->
                    <div th:unless="${question.answered}"
                         class="rounded-md border border-gray-200 bg-gray-50 p-4 text-sm text-gray-700">
                        아직 등록된 답변이 없습니다. 아래 답변 등록 영역에서 답변을 작성해주세요.
                    </div>


                </div>
            </section>

            <!-- 답변 등록 -->
            <section class="rounded-lg border border-gray-200 bg-white">
                <div class="p-5">
                    <div class="flex items-start justify-between gap-4 flex-wrap">
                        <div>
                            <h3 class="text-base font-bold text-gray-900">답변 등록</h3>
                            <p class="mt-1 text-sm text-gray-500">문의에 대한 답변을 작성하고 저장합니다.</p>
                        </div>

                        <span th:if="${question.answered}"
                              class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold
                                     bg-green-50 text-green-700 border border-green-200">
                            이미 답변이 등록된 문의입니다.
                        </span>
                    </div>

                    <form th:action="@{/admin/inquiries/{id}/answer(id=${question.id})}"
                          th:object="${answerRequest}"
                          method="post"
                          class="mt-4 space-y-3">

                        <textarea th:field="*{content}"
                                  rows="6"
                                  th:disabled="${question.answered}"
                                  placeholder="답변 내용을 입력하세요."
                                  class="w-full rounded-md border border-gray-300 p-3 text-sm text-gray-900
                                         placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black/20
                                         disabled:bg-gray-100 disabled:text-gray-500"></textarea>

                        <p th:if="${#fields.hasErrors('content')}"
                           th:errors="*{content}"
                           class="text-sm text-red-600"></p>

                        <div class="flex items-center justify-end gap-2">
                            <a th:href="@{/admin/inquiries}"
                               class="h-10 inline-flex items-center gap-2 rounded-md border border-gray-300 bg-white px-4
                                      text-sm font-semibold text-gray-700 hover:bg-gray-50">
                                취소
                            </a>

                            <button type="submit"
                                    th:disabled="${question.answered}"
                                    class="h-10 inline-flex items-center gap-2 rounded-md bg-black px-4
                                           text-sm font-semibold text-white hover:bg-gray-800
                                           disabled:opacity-50 disabled:cursor-not-allowed">
                                <i class="bi bi-send"></i>
                                답변 저장
                            </button>
                        </div>

                        <!-- CSRF 필요하면 주석 해제 -->
                        <!--
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        -->
                    </form>
                </div>
            </section>

        </div>
    </div>

</div>

</body>
</html>
