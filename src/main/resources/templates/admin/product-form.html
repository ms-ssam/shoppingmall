<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:replace="~{fragments/admin-layout :: layout(~{::div})}">
<body>

<div class="w-full">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- ==================== 숨겨진 파일 input 추가 ==================== -->
    <input type="file" id="mainImageInput" accept="image/*" style="display: none;">
    <input type="file" id="sliderImageInput" accept="image/*" multiple style="display: none;">
    <input type="file" id="descImageInput" accept="image/*" multiple style="display: none;">

    <div class="grid grid-cols-12 gap-6">
        <!-- ==================== 좌측: 이미지 업로드 영역 (크기 축소) ==================== -->
        <div class="col-span-12 lg:col-span-5 space-y-4">

            <!-- 대표 이미지 (크기 축소) -->
            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                <h4 class="text-sm font-semibold mb-3 text-gray-700">대표 이미지 (1장)</h4>
                <div id="mainImageUpload"
                     class="border-2 border-dashed border-gray-300 rounded p-6 text-center cursor-pointer hover:border-teal-500 transition h-32 flex items-center justify-center">
                    <p class="text-gray-500 text-sm">클릭 또는 드래그하여 업로드</p>
                </div>
                <div id="mainImagePreview" class="mt-3"></div>
            </div>

            <!-- 슬라이더 이미지 (크기 축소 + 순서 번호 표시) -->
            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                <div class="flex items-center justify-between mb-3">
                    <h4 class="text-sm font-semibold text-gray-700">슬라이더 이미지 (최대 4장)</h4>
                    <span class="text-xs text-gray-500">드래그하여 순서 변경</span>
                </div>
                <div id="sliderImageList" class="space-y-2 mb-3"></div>
                <button type="button" id="addSliderImageBtn"
                        class="w-full py-2 border border-dashed border-gray-300 rounded text-sm text-gray-600 hover:border-teal-500 hover:text-teal-600 transition">
                    + 이미지 추가
                </button>
            </div>

            <!-- 상세 설명 이미지 (크기 축소) -->
            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                <h4 class="text-sm font-semibold mb-3 text-gray-700">상세 설명 이미지 (최대 10장)</h4>
                <div id="descImageList" class="space-y-2 mb-3"></div>
                <button type="button" id="addDescImageBtn"
                        class="w-full py-2 border border-dashed border-gray-300 rounded text-sm text-gray-600 hover:border-teal-500 hover:text-teal-600 transition">
                    + 이미지 추가
                </button>
            </div>
        </div>

        <!-- ==================== 우측: 상품 정보 입력 ==================== -->
        <div class="col-span-12 lg:col-span-7 space-y-4">
            <div class="bg-white p-6 rounded shadow-sm border border-gray-200">
                <h4 class="text-sm font-semibold mb-4 text-gray-700">상품 정보</h4>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">상품명</label>
                        <input type="text" id="productName"
                               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                               placeholder="상품명을 입력하세요">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">카테고리</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="categoryDisplay" readonly
                                   class="flex-1 px-3 py-2 border border-gray-300 rounded bg-gray-50"
                                   placeholder="카테고리를 선택하세요">
                            <input type="hidden" id="categoryId">
                            <button type="button" onclick="openCategoryModal()"
                                    class="px-4 py-2 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition">
                                설정
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">정가 (원)</label>
                            <input type="number" id="regularPrice"
                                   class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                                   placeholder="0" oninput="calculateSalePrice()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">할인율 (%)</label>
                            <input type="number" id="discountRate" min="0" max="100"
                                   class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                                   placeholder="0" oninput="calculateSalePrice()">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">판매가</label>
                            <p id="salePriceDisplay" class="text-2xl font-bold text-teal-600 mt-1">0원</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">상품 설명</label>
                        <textarea id="productDescription" rows="4"
                                  class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                                  placeholder="상품 설명을 입력하세요"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">상태</label>
                        <select id="productStatus"
                                class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500">
                            <option value="SELLING">판매중</option>
                            <option value="SOLD_OUT">품절</option>
                            <option value="STOP">판매중지</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 상품 옵션 관리 -->
            <div class="bg-white p-6 rounded shadow-sm border border-gray-200">
                <h4 class="text-sm font-semibold mb-4 text-gray-700">상품 옵션 관리</h4>
                <div id="colorVariantList" class="space-y-4"></div>
                <button type="button" onclick="addColorVariant()"
                        class="w-full py-2 border border-dashed border-gray-300 rounded text-sm text-gray-600 hover:border-teal-500 hover:text-teal-600 transition mt-3">
                    + 색상 추가
                </button>
                <p class="text-xs text-gray-500 mt-2">⚠️ SKU는 [색상명]-[사이즈명]-[순번(3자리)] 규칙으로 자동 생성됩니다.</p>
            </div>

            <div class="flex justify-end gap-3">
                <button type="button" onclick="location.href='/admin/products'"
                        class="px-6 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition">
                    취소
                </button>
                <button type="button" onclick="submitProduct()"
                        class="px-6 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">
                    상품 등록
                </button>
            </div>
        </div>
    </div>

    <!-- 카테고리 선택 모달 -->
    <div id="categoryModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4">
            <div class="p-6 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800">카테고리 선택</h3>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <h4 class="text-sm font-medium text-gray-700 mb-2">대분류</h4>
                        <div id="parentCategoryList" class="border border-gray-300 rounded h-64 overflow-y-auto"></div>
                    </div>
                    <div>
                        <h4 class="text-sm font-medium text-gray-700 mb-2">소분류</h4>
                        <div id="childCategoryList" class="border border-gray-300 rounded h-64 overflow-y-auto"></div>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end">
                <button type="button" onclick="closeCategoryModal()"
                        class="px-4 py-2 bg-gray-100 text-gray-700 rounded hover:bg-gray-200 transition">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let mainImage = null;
        let sliderImages = [];
        let descImages = [];
        let colorVariantIndex = 0;

        // ⭐ Thymeleaf 데이터를 JavaScript 변수로 변환
        const categoryTreeData = /*[[${categoryTree}]]*/ [];
        console.log('카테고리 데이터:', categoryTreeData);

        // ==================== 파일 input 이벤트 핸들러 ====================
        document.getElementById('mainImageUpload').addEventListener('click', () => {
            document.getElementById('mainImageInput').click();
        });

        document.getElementById('mainImageInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleMainImage(e.target.files[0]);
            }
        });

        document.getElementById('addSliderImageBtn').addEventListener('click', () => {
            if (sliderImages.length >= 4) {
                alert('슬라이더 이미지는 최대 4장까지 등록 가능합니다.');
                return;
            }
            document.getElementById('sliderImageInput').click();
        });

        document.getElementById('sliderImageInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (sliderImages.length < 4) {
                    handleSliderImage(file);
                }
            });
            e.target.value = '';
        });

        document.getElementById('addDescImageBtn').addEventListener('click', () => {
            if (descImages.length >= 10) {
                alert('상세 설명 이미지는 최대 10장까지 등록 가능합니다.');
                return;
            }
            document.getElementById('descImageInput').click();
        });

        document.getElementById('descImageInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (descImages.length < 10) {
                    handleDescImage(file);
                }
            });
            e.target.value = '';
        });

        // ==================== 대표 이미지 처리 ====================
        function handleMainImage(file) {
            mainImage = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('mainImagePreview');
                preview.innerHTML = `
                    <div class="relative">
                        <img src="${e.target.result}" class="w-full h-32 object-cover rounded">
                        <button type="button" onclick="removeMainImage()"
                                class="absolute top-2 right-2 bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">
                            삭제
                        </button>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        }

        function removeMainImage() {
            mainImage = null;
            document.getElementById('mainImagePreview').innerHTML = '';
            document.getElementById('mainImageInput').value = '';
        }

        const mainUploadArea = document.getElementById('mainImageUpload');

        mainUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            mainUploadArea.classList.add('border-teal-500');
        });

        mainUploadArea.addEventListener('dragleave', () => {
            mainUploadArea.classList.remove('border-teal-500');
        });

        mainUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            mainUploadArea.classList.remove('border-teal-500');
            if (e.dataTransfer.files.length > 0) {
                handleMainImage(e.dataTransfer.files[0]);
            }
        });

        // ==================== 슬라이더 이미지 처리 (순서 번호 표시) ====================
        function handleSliderImage(file) {
            if (sliderImages.length >= 4) {
                alert('슬라이더 이미지는 최대 4장까지 등록 가능합니다.');
                return;
            }

            sliderImages.push(file);
            renderSliderImages();
        }

        function removeSliderImage(index) {
            sliderImages.splice(index, 1);
            renderSliderImages();
        }

        function renderSliderImages() {
            const listDiv = document.getElementById('sliderImageList');
            listDiv.innerHTML = '';
            sliderImages.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'flex items-center gap-3 p-2 border border-gray-200 rounded bg-gray-50 cursor-move';
                    itemDiv.dataset.index = index;
                    itemDiv.innerHTML = `
                        <span class="flex items-center justify-center w-6 h-6 bg-teal-500 text-white text-xs font-bold rounded-full">${index + 1}</span>
                        <img src="${e.target.result}" class="w-12 h-12 object-cover rounded">
                        <span class="flex-1 text-sm text-gray-700 truncate">${file.name}</span>
                        <button type="button" onclick="removeSliderImage(${index})"
                                class="px-2 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600">
                            삭제
                        </button>
                    `;
                    listDiv.appendChild(itemDiv);
                };
                reader.readAsDataURL(file);
            });
        }

        new Sortable(document.getElementById('sliderImageList'), {
            animation: 150,
            onEnd: function(evt) {
                const oldIndex = evt.oldIndex;
                const newIndex = evt.newIndex;
                const temp = sliderImages[oldIndex];
                sliderImages.splice(oldIndex, 1);
                sliderImages.splice(newIndex, 0, temp);
                renderSliderImages();
            }
        });

        // ==================== 상세 설명 이미지 처리 ====================
        function handleDescImage(file) {
            if (descImages.length >= 10) {
                alert('상세 설명 이미지는 최대 10장까지 등록 가능합니다.');
                return;
            }

            descImages.push(file);
            renderDescImages();
        }

        function removeDescImage(index) {
            descImages.splice(index, 1);
            renderDescImages();
        }

        function renderDescImages() {
            const listDiv = document.getElementById('descImageList');
            listDiv.innerHTML = '';
            descImages.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'flex items-center gap-3 p-2 border border-gray-200 rounded bg-gray-50';
                    itemDiv.innerHTML = `
                        <img src="${e.target.result}" class="w-12 h-12 object-cover rounded">
                        <span class="flex-1 text-sm text-gray-700 truncate">${file.name}</span>
                        <button type="button" onclick="removeDescImage(${index})"
                                class="px-2 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600">
                            삭제
                        </button>
                    `;
                    listDiv.appendChild(itemDiv);
                };
                reader.readAsDataURL(file);
            });
        }

        // ==================== 카테고리 모달 ====================
        function openCategoryModal() {
            document.getElementById('categoryModal').classList.remove('hidden');
            document.getElementById('categoryModal').classList.add('flex');
            loadCategories();
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.add('hidden');
            document.getElementById('categoryModal').classList.remove('flex');
        }

        function loadCategories() {
            const parentList = document.getElementById('parentCategoryList');
            parentList.innerHTML = '';

            categoryTreeData.forEach(parent => {
                const div = document.createElement('div');
                div.className = 'p-3 hover:bg-gray-100 cursor-pointer border-b border-gray-200';
                div.textContent = parent.name;
                div.onclick = () => loadChildCategories(parent.id, parent.children, parent.name);
                parentList.appendChild(div);
            });
        }

        function loadChildCategories(parentId, children, parentName) {
            const childList = document.getElementById('childCategoryList');
            childList.innerHTML = '';

            children.forEach(child => {
                const div = document.createElement('div');
                div.className = 'p-3 hover:bg-teal-100 cursor-pointer border-b border-gray-200';
                div.textContent = child.name;
                div.onclick = () => selectCategory(child.id, `${parentName} > ${child.name}`);
                childList.appendChild(div);
            });
        }

        function selectCategory(categoryId, fullPath) {
            document.getElementById('categoryId').value = categoryId;
            document.getElementById('categoryDisplay').value = fullPath;
            closeCategoryModal();
        }

        // ==================== 가격 자동 계산 ====================
        function calculateSalePrice() {
            const regular = parseFloat(document.getElementById('regularPrice').value) || 0;
            const discount = parseFloat(document.getElementById('discountRate').value) || 0;
            const salePrice = Math.floor(regular * (1 - discount / 100));
            document.getElementById('salePriceDisplay').textContent = salePrice.toLocaleString() + '원';
        }

        // ==================== 색상 옵션 관리 ====================
        function addColorVariant() {
            const index = colorVariantIndex++;
            const container = document.getElementById('colorVariantList');
            const variantDiv = document.createElement('div');
            variantDiv.className = 'border border-gray-200 rounded p-4 bg-gray-50';
            variantDiv.id = `colorVariant${index}`;
            variantDiv.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <input type="text" id="colorName${index}" placeholder="색상명 (예: 블랙)"
                           class="flex-1 px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500 mr-2"
                           oninput="updateAllSkus(${index})">
                    <button type="button" onclick="removeColorVariant(${index})"
                            class="px-3 py-2 bg-red-500 text-white rounded text-sm hover:bg-red-600">
                        삭제
                    </button>
                </div>
                <div id="sizeList${index}" class="space-y-2"></div>
                <button type="button" onclick="addSizeVariant(${index})"
                        class="w-full py-2 border border-dashed border-gray-300 rounded text-sm text-gray-600 hover:border-teal-500 hover:text-teal-600 transition mt-2">
                    + 사이즈 추가
                </button>
            `;
            container.appendChild(variantDiv);
        }

        function removeColorVariant(colorIndex) {
            document.getElementById(`colorVariant${colorIndex}`).remove();
        }

        let sizeVariantIndexMap = {};

        function addSizeVariant(colorIndex) {
            if (!sizeVariantIndexMap[colorIndex]) {
                sizeVariantIndexMap[colorIndex] = 0;
            }
            const sizeIndex = sizeVariantIndexMap[colorIndex]++;
            const sizeList = document.getElementById(`sizeList${colorIndex}`);
            const sizeDiv = document.createElement('div');
            sizeDiv.className = 'grid grid-cols-12 gap-2 items-center';
            sizeDiv.id = `size${colorIndex}_${sizeIndex}`;
            sizeDiv.innerHTML = `
                <input type="text" placeholder="사이즈 (예: M)"
                       class="size-name col-span-3 px-2 py-1 border border-gray-300 rounded text-sm focus:ring-teal-500 focus:border-teal-500"
                       oninput="updateSKU(${colorIndex}, ${sizeIndex})">
                <input type="text" readonly
                       class="sku-display col-span-4 px-2 py-1 border border-gray-200 bg-gray-100 rounded text-sm text-gray-600"
                       placeholder="SKU (자동생성)">
                <input type="number" placeholder="재고"
                       class="size-stock col-span-3 px-2 py-1 border border-gray-300 rounded text-sm focus:ring-teal-500 focus:border-teal-500">
                <button type="button" onclick="removeSizeVariant(${colorIndex}, ${sizeIndex})"
                        class="col-span-2 px-2 py-1 bg-gray-300 text-gray-700 rounded text-xs hover:bg-gray-400">
                    삭제
                </button>
            `;
            sizeList.appendChild(sizeDiv);
        }

        function removeSizeVariant(colorIndex, sizeIndex) {
            document.getElementById(`size${colorIndex}_${sizeIndex}`).remove();
        }

        // ⭐ SKU 자동 생성 함수 (3자리 순번)
        function updateSKU(colorIndex, sizeIndex) {
            const colorName = document.getElementById(`colorName${colorIndex}`).value.trim().toUpperCase();
            const sizeDiv = document.getElementById(`size${colorIndex}_${sizeIndex}`);
            const sizeName = sizeDiv.querySelector('.size-name').value.trim().toUpperCase();
            const skuDisplay = sizeDiv.querySelector('.sku-display');

            if (colorName && sizeName) {
                const seq = String(sizeIndex + 1).padStart(3, '0');
                skuDisplay.value = `${colorName}-${sizeName}-${seq}`;
            } else {
                skuDisplay.value = '';
            }
        }

        function updateAllSkus(colorIndex) {
            const sizeList = document.getElementById(`sizeList${colorIndex}`);
            const sizeDivs = sizeList.querySelectorAll('[id^="size' + colorIndex + '_"]');
            sizeDivs.forEach((div) => {
                const sizeIndex = parseInt(div.id.split('_')[1]);
                updateSKU(colorIndex, sizeIndex);
            });
        }

        // ==================== 상품 등록 ====================
        function submitProduct() {
            const name = document.getElementById('productName').value.trim();
            const categoryId = document.getElementById('categoryId').value;
            const regularPrice = parseFloat(document.getElementById('regularPrice').value);
            const discountRate = parseFloat(document.getElementById('discountRate').value) || 0;
            const description = document.getElementById('productDescription').value.trim();
            const status = document.getElementById('productStatus').value;

            if (!name) {
                alert('상품명을 입력하세요.');
                return;
            }
            if (!categoryId) {
                alert('카테고리를 선택하세요.');
                return;
            }
            if (!regularPrice || regularPrice <= 0) {
                alert('정가를 입력하세요.');
                return;
            }
            if (!mainImage) {
                alert('대표 이미지를 업로드하세요.');
                return;
            }

            // 옵션 그룹 수집
            const optionGroups = [];
            const colorDivs = document.querySelectorAll('[id^="colorVariant"]');

            colorDivs.forEach((colorDiv) => {
                const colorIndex = colorDiv.id.replace('colorVariant', '');
                const colorNameInput = document.getElementById(`colorName${colorIndex}`);

                if (!colorNameInput) return;

                const colorName = colorNameInput.value.trim();
                if (!colorName) return;

                const details = [];
                const sizeDivs = colorDiv.querySelectorAll(`[id^="size${colorIndex}_"]`);

                let displayOrder = 1;
                sizeDivs.forEach((sizeDiv) => {
                    const sizeNameInput = sizeDiv.querySelector('.size-name');
                    const skuInput = sizeDiv.querySelector('.sku-display');
                    const stockInput = sizeDiv.querySelector('.size-stock');

                    if (!sizeNameInput || !skuInput || !stockInput) return;

                    const sizeName = sizeNameInput.value.trim();
                    const sku = skuInput.value.trim();
                    const stock = parseInt(stockInput.value) || 0;

                    if (sizeName && sku) {
                        details.push({
                            name: sizeName,
                            sku: sku,
                            addPrice: 0,
                            stockQuantity: stock,
                            displayOrder: displayOrder++
                        });
                    }
                });

                if (details.length > 0) {
                    optionGroups.push({
                        name: colorName,
                        displayOrder: optionGroups.length + 1,
                        details: details
                    });
                }
            });

            if (optionGroups.length === 0) {
                alert('최소 1개 이상의 색상/사이즈 옵션을 추가하세요.');
                return;
            }

            // FormData 생성
            const formData = new FormData();

            const productData = {
                name: name,
                price: regularPrice,
                discountRate: discountRate,
                description: description,
                categoryId: parseInt(categoryId),
                status: status,
                optionGroups: optionGroups
                // images 필드 제거 (파일로 별도 전송)
            };

            formData.append('data', new Blob([JSON.stringify(productData)], {type: 'application/json'}));

            if (mainImage) {
                formData.append('mainImage', mainImage);
            }
            sliderImages.forEach(img => {
                formData.append('sliderImages', img);
            });
            descImages.forEach(img => {
                formData.append('descImages', img);
            });

            console.log('전송할 데이터:', productData);

            fetch('/api/admin/products', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if(data.success) {
                        alert("상품이 성공적으로 등록되었습니다.");
                        location.href = '/admin/products';
                    } else {
                        alert("등록 실패: " + data.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("서버 오류가 발생했습니다.");
                });
        }



        /*]]>*/
    </script>

</div>
</body>
</html>
