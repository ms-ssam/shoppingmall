<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:replace="~{fragments/admin-layout :: layout(~{::div})}">
<body>

<div class="w-full">

    <div class="grid grid-cols-12 gap-6">

        <!-- ==================== 좌측: 카테고리 트리 ==================== -->
        <div class="col-span-12 lg:col-span-5">
            <div class="bg-white p-6 rounded shadow-sm border border-gray-200">
                <div class="flex items-center justify-between mb-4">
                    <h4 class="text-lg font-semibold text-gray-800">카테고리 목록</h4>
                    <button type="button" onclick="openAddParentModal()"
                            class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition text-sm">
                        <i class="bi bi-plus-circle mr-1"></i> 최상위 추가
                    </button>
                </div>

                <div id="categoryTree" class="space-y-2 max-h-[600px] overflow-y-auto">
                    <!-- 카테고리 트리가 여기에 동적으로 생성됩니다 -->
                </div>

                <div class="mt-4 p-3 bg-gray-50 rounded text-xs text-gray-600">
                    <p><i class="bi bi-info-circle mr-1"></i> 카테고리를 클릭하여 수정/삭제할 수 있습니다.</p>
                    <p class="mt-1"><i class="bi bi-chevron-down mr-1"></i> 상위 카테고리를 클릭하면 하위 카테고리를 펼칠 수 있습니다.</p>
                </div>
            </div>
        </div>

        <!-- ==================== 우측: 카테고리 상세/편집 ==================== -->
        <div class="col-span-12 lg:col-span-7">
            <!-- 초기 안내 메시지 -->
            <div id="emptyState" class="bg-white p-12 rounded shadow-sm border border-gray-200 text-center">
                <i class="bi bi-folder text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500">카테고리를 선택하거나 새로 추가해주세요.</p>
            </div>

            <!-- 카테고리 상세/편집 폼 (처음에는 숨김) -->
            <div id="categoryDetailForm" class="bg-white p-6 rounded shadow-sm border border-gray-200 hidden">
                <div class="flex items-center justify-between mb-6">
                    <h4 class="text-lg font-semibold text-gray-800">카테고리 편집</h4>
                    <button type="button" onclick="clearSelection()"
                            class="text-gray-500 hover:text-gray-700">
                        <i class="bi bi-x-lg text-xl"></i>
                    </button>
                </div>

                <input type="hidden" id="categoryId">
                <input type="hidden" id="categoryParentId">

                <div class="space-y-4">
                    <!-- 카테고리 레벨 표시 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">카테고리 레벨</label>
                        <div id="categoryLevel" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded text-gray-700">
                            -
                        </div>
                    </div>

                    <!-- 상위 카테고리 (하위 카테고리인 경우만 표시) -->
                    <div id="parentCategorySection" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-1">상위 카테고리</label>
                        <div id="parentCategoryDisplay" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded text-gray-700">
                            -
                        </div>
                    </div>

                    <!-- 카테고리명 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            카테고리명 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="categoryName"
                               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                               placeholder="카테고리명을 입력하세요"
                               oninput="generateSlug()">
                    </div>

                    <!-- Slug (자동 생성 - 읽기 전용) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Slug (URL 식별자) <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="categorySlug" readonly
                               class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded text-gray-600 cursor-not-allowed"
                               placeholder="카테고리명 입력 시 자동 생성됩니다">
                        <p class="text-xs text-gray-500 mt-1">카테고리명을 입력하면 자동으로 생성됩니다.</p>
                    </div>

                    <!-- 표시 순서 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">표시 순서</label>
                        <input type="number" id="displayOrder" min="1"
                               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                               placeholder="1">
                        <p class="text-xs text-gray-500 mt-1">숫자가 작을수록 먼저 표시됩니다.</p>
                    </div>

                    <!-- 노출 여부 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">노출 여부</label>
                        <select id="isVisible"
                                class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500">
                            <option value="true">노출</option>
                            <option value="false">숨김</option>
                        </select>
                    </div>
                </div>

                <!-- 버튼 영역 -->
                <div class="flex items-center justify-between mt-6 pt-6 border-t border-gray-200">
                    <div>
                        <button type="button" id="deleteBtn" onclick="deleteCategory()"
                                class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition text-sm">
                            <i class="bi bi-trash mr-1"></i> 삭제
                        </button>
                        <button type="button" id="addChildBtn" onclick="openAddChildModal()"
                                class="ml-2 px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600 transition text-sm">
                            <i class="bi bi-plus-circle mr-1"></i> 하위 카테고리 추가
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="clearSelection()"
                                class="px-6 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition">
                            취소
                        </button>
                        <button type="button" onclick="saveCategory()"
                                class="px-6 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">
                            저장
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 최상위 카테고리 추가 모달 ==================== -->
    <div id="addParentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="p-6 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800">최상위 카테고리 추가</h3>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        카테고리명 <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="newParentName"
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                           placeholder="예: 상의, 하의, 아우터"
                           oninput="generateModalSlug('parent')">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Slug <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="newParentSlug" readonly
                           class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded text-gray-600 cursor-not-allowed"
                           placeholder="자동 생성됩니다">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">표시 순서</label>
                    <input type="number" id="newParentOrder" min="1" value="1"
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500">
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end gap-2">
                <button type="button" onclick="closeAddParentModal()"
                        class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition">
                    취소
                </button>
                <button type="button" onclick="createParentCategory()"
                        class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">
                    추가
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== 하위 카테고리 추가 모달 ==================== -->
    <div id="addChildModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="p-6 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800">하위 카테고리 추가</h3>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">상위 카테고리</label>
                    <div id="selectedParentName" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded text-gray-700 font-medium">
                        -
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        카테고리명 <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="newChildName"
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500"
                           placeholder="예: 민소매, 반팔, 긴팔"
                           oninput="generateModalSlug('child')">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Slug <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="newChildSlug" readonly
                           class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded text-gray-600 cursor-not-allowed"
                           placeholder="자동 생성됩니다">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">표시 순서</label>
                    <input type="number" id="newChildOrder" min="1" value="1"
                           class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-teal-500 focus:border-teal-500">
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end gap-2">
                <button type="button" onclick="closeAddChildModal()"
                        class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition">
                    취소
                </button>
                <button type="button" onclick="createChildCategory()"
                        class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 transition">
                    추가
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/

        let categoryData = [];
        let selectedCategoryId = null;
        let selectedParentIdForChild = null;
        let expandedParents = new Set();

        const initialCategoryTree = /*[[${categoryTree}]]*/ [];

        console.log('초기 카테고리 트리:', initialCategoryTree);

        // 한글 → 영문 변환 매핑
        const koreanToEnglish = {
            '상의': 'tops', '하의': 'bottoms', '아우터': 'outer', '기타': 'etc',
            '민소매': 'sleeveless', '반팔': 'short-sleeve', '긴팔': 'long-sleeve',
            '맨투맨': 'mtm', '후드티': 'hoodie', '셔츠': 'shirt', '니트': 'knit',
            '청바지': 'jeans', '면바지': 'cotton-pants', '반바지': 'shorts',
            '조거': 'jogger', '트레이닝': 'training', '자켓': 'jacket', '코트': 'coat',
            '패딩': 'padded', '후드집업': 'hood-zipup', '가디건': 'cardigan',
            '모자': 'hat', '벨트': 'belt', '아이웨어': 'eyewear', '양말': 'socks', '장갑': 'gloves'
        };

        // 페이지 로드 시 초기 데이터 평면화 및 렌더링
        document.addEventListener('DOMContentLoaded', () => {
            categoryData = flattenCategoryTree(initialCategoryTree);
            console.log('평면화된 카테고리 데이터:', categoryData);
            renderCategoryTree();
        });

        // ==================== 트리 → 평면 리스트 변환 ====================
        function flattenCategoryTree(tree) {
            const result = [];
            tree.forEach(parent => {
                result.push({
                    id: parent.id,
                    name: parent.name,
                    slug: parent.slug,
                    parentId: null,
                    depth: parent.depth,
                    displayOrder: parent.displayOrder,
                    isVisible: parent.isVisible
                });

                if (parent.children && parent.children.length > 0) {
                    parent.children.forEach(child => {
                        result.push({
                            id: child.id,
                            name: child.name,
                            slug: child.slug,
                            parentId: parent.id,
                            depth: child.depth,
                            displayOrder: child.displayOrder,
                            isVisible: child.isVisible
                        });
                    });
                }
            });
            return result;
        }

        // ==================== Slug 자동 생성 ====================
        function generateSlug() {
            const name = document.getElementById('categoryName').value.trim();
            const slugInput = document.getElementById('categorySlug');

            if (!name) {
                slugInput.value = '';
                return;
            }

            if (koreanToEnglish[name]) {
                slugInput.value = koreanToEnglish[name];
            } else {
                let slug = name
                    .replace(/[^\w\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .toLowerCase()
                    .replace(/[ㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
                slugInput.value = slug || 'category';
            }
        }

        function generateModalSlug(type) {
            const nameInputId = type === 'parent' ? 'newParentName' : 'newChildName';
            const slugInputId = type === 'parent' ? 'newParentSlug' : 'newChildSlug';

            const name = document.getElementById(nameInputId).value.trim();
            const slugInput = document.getElementById(slugInputId);

            if (!name) {
                slugInput.value = '';
                return;
            }

            if (koreanToEnglish[name]) {
                slugInput.value = koreanToEnglish[name];
            } else {
                let slug = name
                    .replace(/[^\w\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .toLowerCase()
                    .replace(/[ㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
                slugInput.value = slug || 'category';
            }
        }

        // ==================== 카테고리 트리 렌더링 ====================
        function renderCategoryTree() {
            const container = document.getElementById('categoryTree');
            container.innerHTML = '';

            if (categoryData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="bi bi-inbox text-4xl mb-2"></i>
                        <p>등록된 카테고리가 없습니다.</p>
                    </div>
                `;
                return;
            }

            const parents = categoryData.filter(c => c.depth === 0).sort((a, b) => a.displayOrder - b.displayOrder);
            const children = categoryData.filter(c => c.depth === 1);

            parents.forEach(parent => {
                const parentDiv = createParentCategoryItem(parent);
                container.appendChild(parentDiv);

                const parentChildren = children.filter(c => c.parentId === parent.id)
                    .sort((a, b) => a.displayOrder - b.displayOrder);

                if (parentChildren.length > 0) {
                    const childContainer = document.createElement('div');
                    childContainer.className = 'ml-6 mt-1 space-y-1';
                    childContainer.id = `children-${parent.id}`;
                    childContainer.style.display = expandedParents.has(parent.id) ? 'block' : 'none';

                    parentChildren.forEach(child => {
                        const childDiv = createChildCategoryItem(child);
                        childContainer.appendChild(childDiv);
                    });

                    container.appendChild(childContainer);
                }
            });
        }

        function createParentCategoryItem(category) {
            const div = document.createElement('div');
            const hasChildren = categoryData.filter(c => c.parentId === category.id).length > 0;
            const isExpanded = expandedParents.has(category.id);

            div.className = `p-3 border border-gray-200 rounded transition bg-white font-medium ${
                selectedCategoryId === category.id ? 'ring-2 ring-teal-500 bg-teal-50' : 'hover:bg-teal-50'
            }`;

            const statusBadge = category.isVisible
                ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">노출</span>'
                : '<span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">숨김</span>';

            const childCount = categoryData.filter(c => c.parentId === category.id).length;
            const childBadge = childCount > 0
                ? `<span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded ml-1">${childCount}개</span>`
                : '';

            const toggleIcon = hasChildren
                ? `<i class="bi bi-chevron-${isExpanded ? 'down' : 'right'} text-gray-600 mr-2" style="cursor: pointer;" onclick="event.stopPropagation(); toggleChildren(${category.id});"></i>`
                : '<span class="w-5 inline-block mr-2"></span>';

            div.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 flex-1 cursor-pointer" onclick="selectCategory(${JSON.stringify(category).replace(/"/g, '&quot;')})">
                        ${toggleIcon}
                        <i class="bi bi-folder-fill text-teal-600"></i>
                        <span>${category.name}</span>
                        <span class="text-xs text-gray-500">(${category.slug})</span>
                        ${childBadge}
                    </div>
                    <div class="flex items-center gap-2">
                        ${statusBadge}
                        <span class="text-xs text-gray-400">#${category.displayOrder}</span>
                    </div>
                </div>
            `;

            return div;
        }

        function createChildCategoryItem(category) {
            const div = document.createElement('div');
            div.className = `p-3 border border-gray-200 rounded cursor-pointer transition bg-gray-50 ${
                selectedCategoryId === category.id ? 'ring-2 ring-teal-500 bg-teal-50' : 'hover:bg-teal-50'
            }`;
            div.onclick = () => selectCategory(category);

            const statusBadge = category.isVisible
                ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">노출</span>'
                : '<span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">숨김</span>';

            div.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="bi bi-folder text-purple-600"></i>
                        <span>${category.name}</span>
                        <span class="text-xs text-gray-500">(${category.slug})</span>
                    </div>
                    <div class="flex items-center gap-2">
                        ${statusBadge}
                        <span class="text-xs text-gray-400">#${category.displayOrder}</span>
                    </div>
                </div>
            `;

            return div;
        }

        function toggleChildren(parentId) {
            const childContainer = document.getElementById(`children-${parentId}`);
            if (childContainer) {
                if (expandedParents.has(parentId)) {
                    expandedParents.delete(parentId);
                } else {
                    expandedParents.add(parentId);
                }
                renderCategoryTree();
            }
        }

        // ==================== 카테고리 선택 ====================
        function selectCategory(category) {
            selectedCategoryId = category.id;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('categoryDetailForm').classList.remove('hidden');

            document.getElementById('categoryId').value = category.id;
            document.getElementById('categoryName').value = category.name;
            document.getElementById('categorySlug').value = category.slug;
            document.getElementById('displayOrder').value = category.displayOrder;
            document.getElementById('isVisible').value = category.isVisible;

            const isParent = category.depth === 0;
            document.getElementById('categoryLevel').textContent = isParent ? '최상위 카테고리 (대분류)' : '하위 카테고리 (소분류)';

            if (!isParent && category.parentId) {
                document.getElementById('categoryParentId').value = category.parentId;
                document.getElementById('parentCategorySection').classList.remove('hidden');
                const parent = categoryData.find(p => p.id === category.parentId);
                document.getElementById('parentCategoryDisplay').textContent = parent ? parent.name : '-';
            } else {
                document.getElementById('parentCategorySection').classList.add('hidden');
                document.getElementById('categoryParentId').value = '';
            }

            document.getElementById('addChildBtn').classList.toggle('hidden', !isParent);
            renderCategoryTree();
        }

        function clearSelection() {
            selectedCategoryId = null;
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('categoryDetailForm').classList.add('hidden');
            renderCategoryTree();
        }

        // ==================== CRUD (페이지 새로고침) ====================
        function saveCategory() {
            const id = document.getElementById('categoryId').value;
            const name = document.getElementById('categoryName').value.trim();
            const slug = document.getElementById('categorySlug').value.trim();
            const displayOrder = parseInt(document.getElementById('displayOrder').value) || 1;
            const isVisible = document.getElementById('isVisible').value === 'true';
            const parentId = document.getElementById('categoryParentId').value;

            if (!name || !slug) {
                alert('카테고리명과 Slug를 입력하세요.');
                return;
            }

            fetch(`/api/admin/categories/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name,
                    slug,
                    displayOrder,
                    isVisible,
                    parentId: parentId ? parseInt(parentId) : null
                })
            })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        alert('카테고리가 수정되었습니다.');
                        window.location.reload();
                    } else {
                        alert('수정 실패: ' + result.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('서버 오류가 발생했습니다.');
                });
        }

        function deleteCategory() {
            const id = document.getElementById('categoryId').value;
            const name = document.getElementById('categoryName').value;
            const childCount = categoryData.filter(c => c.parentId == id).length;

            if (childCount > 0) {
                alert(`하위 카테고리가 ${childCount}개 있습니다.\n먼저 하위 카테고리를 삭제해주세요.`);
                return;
            }

            if (!confirm(`"${name}" 카테고리를 삭제하시겠습니까?`)) return;

            fetch(`/api/admin/categories/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        alert('카테고리가 삭제되었습니다.');
                        window.location.reload();
                    } else {
                        alert('삭제 실패: ' + result.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('서버 오류가 발생했습니다.');
                });
        }

        function openAddParentModal() {
            document.getElementById('newParentName').value = '';
            document.getElementById('newParentSlug').value = '';
            const maxOrder = Math.max(...categoryData.filter(c => c.depth === 0).map(c => c.displayOrder), 0);
            document.getElementById('newParentOrder').value = maxOrder + 1;
            document.getElementById('addParentModal').classList.remove('hidden');
            document.getElementById('addParentModal').classList.add('flex');
        }

        function closeAddParentModal() {
            document.getElementById('addParentModal').classList.add('hidden');
            document.getElementById('addParentModal').classList.remove('flex');
        }

        function createParentCategory() {
            const name = document.getElementById('newParentName').value.trim();
            const slug = document.getElementById('newParentSlug').value.trim();
            const displayOrder = parseInt(document.getElementById('newParentOrder').value) || 1;

            if (!name || !slug) {
                alert('카테고리명과 Slug를 입력하세요.');
                return;
            }

            fetch('/api/admin/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, slug, displayOrder, isVisible: true, parentId: null })
            })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        alert('최상위 카테고리가 추가되었습니다.');
                        window.location.reload();
                    } else {
                        alert('추가 실패: ' + result.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('서버 오류가 발생했습니다.');
                });
        }

        function openAddChildModal() {
            const parentId = document.getElementById('categoryId').value;
            const parentName = document.getElementById('categoryName').value;

            if (!parentId) {
                alert('상위 카테고리를 선택하세요.');
                return;
            }

            selectedParentIdForChild = parentId;
            const childCount = categoryData.filter(c => c.parentId == parentId).length;

            document.getElementById('selectedParentName').textContent = parentName;
            document.getElementById('newChildName').value = '';
            document.getElementById('newChildSlug').value = '';
            document.getElementById('newChildOrder').value = childCount + 1;
            document.getElementById('addChildModal').classList.remove('hidden');
            document.getElementById('addChildModal').classList.add('flex');
        }

        function closeAddChildModal() {
            document.getElementById('addChildModal').classList.add('hidden');
            document.getElementById('addChildModal').classList.remove('flex');
        }

        function createChildCategory() {
            const parentId = selectedParentIdForChild;
            const name = document.getElementById('newChildName').value.trim();
            const slug = document.getElementById('newChildSlug').value.trim();
            const displayOrder = parseInt(document.getElementById('newChildOrder').value) || 1;

            if (!name || !slug) {
                alert('카테고리명과 Slug를 입력하세요.');
                return;
            }

            fetch('/api/admin/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, slug, displayOrder, isVisible: true, parentId: parseInt(parentId) })
            })
                .then(res => res.json())
                .then(result => {
                    if (result.success) {
                        alert('하위 카테고리가 추가되었습니다.');
                        window.location.reload();
                    } else {
                        alert('추가 실패: ' + result.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('서버 오류가 발생했습니다.');
                });
        }

        /*]]>*/
    </script>

</div>
