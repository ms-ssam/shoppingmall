<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 24px;
            background-color: #ffffff;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .input-box {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            margin-bottom: 22px;
            background: #f9f9f9;
        }

        .btn-primary {
            width: 100%;
            padding: 16px 0;
            border-radius: 999px;
            background: black;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        #signupError {
            margin-top: 8px;
            color: #ff4d4f;
            font-size: 13px;
        }

        #signupSuccess {
            margin-top: 8px;
            color: #52c41a;
            font-size: 13px;
        }

        .to-login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .to-login a {
            text-decoration: none;
            color: #555;
        }
    </style>

</head>

<body>
<div class="container">
    <h1>Sign up</h1>

    <form id="signupForm">
        <label for="email">Email</label>
        <input id="email" class="input-box" type="email" required>

        <label for="password">Password</label>
        <input id="password" class="input-box" type="password" required>

        <label for="passwordConfirm">Password Check</label>
        <input id="passwordConfirm" class="input-box" type="password" required>

        <label for="name">Name</label>
        <input id="name" class="input-box" type="text" required>

        <label for="nickname">Nickname</label>
        <input id="nickname" class="input-box" type="text" required>

        <label for="phone">Phone</label>
        <!-- 숫자만 받게 하고 싶으면 pattern도 추가 가능 -->
        <input id="phone" class="input-box" type="tel" required placeholder="01012345678">

        <button type="submit" class="btn-primary">회원가입</button>
    </form>

    <p id="signupError" style="display:none;"></p>
    <p id="signupSuccess" style="display:none;"></p>

    <div class="to-login">
        이미 계정이 있으신가요?
        <a th:href="@{/login}">로그인하러 가기</a>
    </div>
</div>

<script>
    const signupForm = document.getElementById('signupForm');
    const signupError = document.getElementById('signupError');
    const signupSuccess = document.getElementById('signupSuccess');

    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;
        const name = document.getElementById('name').value;
        const nickname = document.getElementById('nickname').value;
        const phone = document.getElementById('phone').value;

        signupError.style.display = 'none';
        signupSuccess.style.display = 'none';

        if (password !== passwordConfirm) {
            signupError.textContent = '비밀번호가 일치하지 않습니다.';
            signupError.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email,
                    password,
                    name,
                    nickname,
                    phone
                })
            });

            if (!res.ok) {
                // 백엔드에서 validation 메시지를 내려줄 거면 여기서 꺼내서 표시해도 됨
                signupError.textContent = '회원가입에 실패했습니다.';
                signupError.style.display = 'block';
                return;
            }

            signupSuccess.textContent = '회원가입 완료! 로그인 페이지로 이동합니다.';
            signupSuccess.style.display = 'block';

            setTimeout(() => {
                window.location.href = '/login';
            }, 1200);

        } catch (err) {
            signupError.textContent = '오류가 발생했습니다.';
            signupError.style.display = 'block';
        }
    });
</script>

</body>
</html>
