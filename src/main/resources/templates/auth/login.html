<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 24px;
            background-color: #ffffff;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        h1 {
            font-size: 46px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            margin-bottom: 24px;
            background: #f9f9f9;
        }

        .input-box::placeholder {
            color: #aaa;
        }

        .sub-links {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #808080;
            margin-bottom: 30px;
        }

        .sub-links a {
            color: #808080;
            text-decoration: none;
        }

        .sub-links a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 16px 0;
            border-radius: 999px;
            border: none;
            font-size: 15px;
            background: black;
            color: white;
            cursor: pointer;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        #loginError {
            color: #ff4d4f;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>LOGIN</h1>

    <form id="loginForm">
        <label for="email">ID</label>
        <input id="email" class="input-box" type="text"
               name="email" placeholder="ID" required>

        <label for="password">Password</label>
        <input id="password" class="input-box" type="password"
               name="password" placeholder="Password" required>

        <div class="sub-links">
            <a th:href="@{/signup}">Sign up</a>
            <div>
                <a href="#" style="margin-right:8px;">Find ID</a> |
                <a href="#" style="margin-left:8px;">Find Password</a>
            </div>
        </div>

        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <p class="error-message" id="loginError" style="display:none;"></p>
</div>


<script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });

            if (!res.ok) {
                loginError.textContent = "로그인 실패: ID 또는 비밀번호를 확인하세요.";
                loginError.style.display = 'block';
                return;
            }

            const data = await res.json();
            localStorage.setItem('accessToken', data.accessToken);

            window.location.href = '/';
        } catch (err) {
            loginError.textContent = '로그인 중 오류가 발생했습니다.';
            loginError.style.display = 'block';
        }
    });
</script>

</body>
</html>
