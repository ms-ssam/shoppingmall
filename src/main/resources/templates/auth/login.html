<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 24px;
            background-color: #ffffff;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        h1 {
            font-size: 46px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            margin-bottom: 24px;
            background: #f9f9f9;
        }

        .input-box::placeholder {
            color: #aaa;
        }

        .sub-links {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #808080;
            margin-bottom: 30px;
        }

        .sub-links a {
            color: #808080;
            text-decoration: none;
        }

        .sub-links a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 16px 0;
            border-radius: 999px;
            border: none;
            font-size: 15px;
            background: black;
            color: white;
            cursor: pointer;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        #loginError {
            color: #ff4d4f;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>LOGIN</h1>

    <!-- ✅ 여기 수정: form을 /login POST로 보냄 -->
    <form th:action="@{/login}" method="post">
        <label for="email">ID</label>
        <input id="email" class="input-box" type="text"
               name="email" placeholder="ID" required>

        <label for="password">Password</label>
        <input id="password" class="input-box" type="password"
               name="password" placeholder="Password" required>

        <div class="sub-links">
            <a th:href="@{/signup}">Sign up</a>
            <div>
                <a href="#" style="margin-right:8px;">Find ID</a> |
                <a href="#" style="margin-left:8px;">Find Password</a>
            </div>
        </div>

        <button type="submit" class="btn-primary">로그인</button>
    </form>

    <!-- 에러 메시지 표시용 (선택사항: 컨트롤러에서 model에 error 넣어줄 때 사용) -->
    <p class="error-message" id="loginError"
       th:if="${param.error}" th:text="${param.error}"></p>
</div>

<!-- ✅ JS fetch 로그인은 이제 필요 없음, 전부 서버에서 처리하니까 스크립트 삭제 -->
</body>
</html>
