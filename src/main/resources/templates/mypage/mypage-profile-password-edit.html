<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 - 비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-layout.css}">
    <link rel="stylesheet" th:href="@{/css/mypage-profile-edit.css}">
</head>
<body>
<div th:replace="~{fragments/header :: topHeader(${cartCount})}"></div>

<div class="mypage-container">
    <!-- 사이드바 -->
    <div th:replace="~{fragments/mypage-sidebar :: mypageSidebar}"></div>

    <!-- 오른쪽 메인 -->
    <main class="mypage-content">
        <section class="profile-edit-card">
            <header class="profile-edit-header">
                <h2 class="profile-edit-title">비밀번호 변경</h2>
            </header>

            <!-- 성공/현재 비밀번호 불일치/현재 비밀번호랑 새 비밀번호 일치 메시지 -->
            <div th:if="${message}"
                 th:classappend="${error} ? ' alert-error' : ' alert-success'"
                 class="alert">
                <span th:text="${message}"></span>
            </div>

            <!-- 비밀번호 변경 폼 -->
            <section class="profile-edit-body">
                <form th:action="@{/mypage/profile/password}"
                      th:object="${form}"
                      method="post"
                      class="profile-edit-form">

                    <!-- PUT 지원 -->
                    <input type="hidden" name="_method" value="PUT"/>

                    <!-- 현재 비밀번호 -->
                    <div class="form-row">
                        <label for="currentPassword">현재 비밀번호</label>
                        <input id="currentPassword"
                               type="password"
                               th:field="*{currentPassword}">
                        <!-- 이 필드에 대한 에러 중 첫 번째만 출력 -->
                        <div class="error"
                             th:if="${#fields.hasErrors('currentPassword')}"
                             th:text="${#fields.errors('currentPassword')[0]}">
                        </div>
                    </div>

                    <!-- 새 비밀번호 -->
                    <div class="form-row">
                        <label for="newPassword">새 비밀번호</label>
                        <div class="password-hint">
                            영문, 숫자, 특수문자(@$!%*#?&)를 포함한 8~20자 비밀번호를 입력하세요.
                        </div>
                        <input id="newPassword"
                               type="password"
                               th:field="*{newPassword}">
                        <!-- NotBlank / Size / Pattern 중 첫 번째 에러만 -->
                        <div class="error"
                             th:if="${#fields.hasErrors('newPassword')}"
                             th:text="${#fields.errors('newPassword')[0]}">
                        </div>
                    </div>

                    <!-- 새 비밀번호 확인 -->
                    <div class="form-row">
                        <label for="newPasswordConfirm">새 비밀번호 확인</label>
                        <div class="password-hint">
                            새 비밀번호를 한번 더 입력해주세요.
                        </div>
                        <input id="newPasswordConfirm"
                               type="password"
                               th:field="*{newPasswordConfirm}">
                        <!-- NotBlank 또는 PasswordMatch 중 첫 번째 에러만 -->
                        <div class="error"
                             th:if="${#fields.hasErrors('newPasswordConfirm')}"
                             th:text="${#fields.errors('newPasswordConfirm')[0]}">
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            비밀번호 변경
                        </button>
                    </div>
                </form>
            </section>
        </section>
    </main>
</div>
</body>
</html>
