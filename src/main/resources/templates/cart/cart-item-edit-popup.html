<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>옵션 변경</title>

    <style>
        /* 전체 오버레이 */
        .cart-edit-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* 팝업 카드 */
        .cart-edit-modal {
            background: #fff;
            border-radius: 12px;
            padding: 24px 28px 20px;
            min-width: 420px;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .cart-edit-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .cart-edit-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-edit-row {
            display: flex;
            gap: 16px;
        }

        .cart-edit-field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cart-edit-label {
            font-size: 13px;
            color: #555;
        }

        .cart-edit-select,
        .cart-edit-qty-input {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 8px 10px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .cart-edit-select:focus,
        .cart-edit-qty-input:focus {
            border-color: #000;
        }

        /* 수량 컨트롤 */
        .qty-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-box {
            display: inline-flex;
            align-items: center;
            border-radius: 8px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .qty-btn {
            width: 36px;
            height: 32px;
            border: none;
            background: #f7f7f7;
            font-size: 18px;
            cursor: pointer;
        }

        .qty-btn:active {
            background: #eee;
        }

        .cart-edit-qty-input {
            width: 50px;
            text-align: center;
            border: none;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            padding: 0;
        }

        /* 하단 버튼 영역 */
        .cart-edit-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-edit-primary,
        .btn-edit-secondary {
            flex: 1;
            height: 42px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-edit-primary {
            border: none;
            background: #000;
            color: #fff;
        }

        .btn-edit-primary:active {
            opacity: 0.85;
        }

        .btn-edit-secondary {
            border: 1px solid #ddd;
            background: #fff;
            color: #333;
        }

        .btn-edit-secondary:active {
            background: #f5f5f5;
        }
    </style>
</head>
<body>

<div class="cart-edit-overlay">
    <div class="cart-edit-modal">

        <h2 class="cart-edit-title">옵션 변경</h2>

        <!-- 수정 폼 -->
        <form class="cart-edit-form"
              th:action="@{'/cart/' + ${cartItemId} + '/option'}"
              method="post"
              onsubmit="return validateCartEditForm()">

            <input type="hidden" name="_method" value="put">

            <!-- 색상 / 사이즈 -->
            <div class="cart-edit-row">
                <!-- 색상 -->
                <div class="cart-edit-field">
                    <span class="cart-edit-label">색상</span>
                    <select class="cart-edit-select"
                            id="cartOptionGroupSelect"
                            name="productOptionGroupId">
                        <option value="">색상을 선택하세요</option>
                        <option th:each="group : ${cartItem.optionGroups}"
                                th:value="${group.id}"
                                th:text="${group.name}"
                                th:selected="${group.id} == ${cartItem.selectedProductOptionGroupId}">
                        </option>
                    </select>
                </div>

                <!-- 사이즈 -->
                <div class="cart-edit-field">
                    <span class="cart-edit-label">사이즈</span>
                    <select class="cart-edit-select"
                            id="cartOptionDetailSelect"
                            name="optionDetailId">
                        <option value="">사이즈를 선택하세요</option>
                        <option th:each="detail : ${cartItem.optionDetails}"
                                th:value="${detail.id}"
                                th:text="${detail.name}"
                                th:selected="${detail.id} == ${cartItem.selectedOptionDetailId}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- 수량 -->
            <div class="cart-edit-field">
                <span class="cart-edit-label">수량</span>
                <div class="qty-wrapper">
                    <div class="qty-box">
                        <button type="button"
                                class="qty-btn"
                                onclick="changeCartQty(-1)">−</button>
                        <input type="number"
                               class="cart-edit-qty-input"
                               name="updatedQuantity"
                               min="1"
                               th:value="${cartItem.selectedQuantity}"
                               id="cartEditQtyInput">
                        <button type="button"
                                class="qty-btn"
                                onclick="changeCartQty(1)">＋</button>
                    </div>
                </div>
            </div>

            <!-- 하단 버튼 -->
            <div class="cart-edit-actions">
                <button type="submit" class="btn-edit-primary">변경</button>
                <button type="button"
                        class="btn-edit-secondary"
                        onclick="closeCartEditPopup()">취소</button>
            </div>

        </form>
    </div>
</div>

<script th:inline="javascript">
    // 수량 증감
    function changeCartQty(delta) {
        const input = document.getElementById('cartEditQtyInput');
        let value = parseInt(input.value || '1', 10);
        value = value + delta;
        if (value < 1) value = 1;
        input.value = value;
    }

    (function () {
        const groupSelect  = document.getElementById('cartOptionGroupSelect');   // 색상
        const detailSelect = document.getElementById('cartOptionDetailSelect'); // 사이즈

        if (!groupSelect || !detailSelect) return;

        // "사이즈를 선택하세요"로 초기화
        function resetOptionDetails() {
            detailSelect.innerHTML = '';

            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = '사이즈를 선택하세요';
            detailSelect.appendChild(defaultOpt);
        }

        // 비동기 결과 렌더링
        function renderOptionDetails(details) {
            resetOptionDetails();
            details.forEach(function (detail) {
                const opt = document.createElement('option');
                opt.value = detail.id;
                opt.textContent = detail.name;
                detailSelect.appendChild(opt);
            });
        }

        groupSelect.addEventListener('change', function () {
            const groupId = this.value;

            // 색상 바꾸면 무조건 초기화
            resetOptionDetails();

            if (!groupId) return;

            fetch('/api/cart/groups/' + groupId + '/details', {   // 여기 경로
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            })
                .then(function (response) {
                    if (!response.ok) throw new Error('옵션 디테일 조회 실패');
                    return response.json();
                })
                .then(function (data) {
                    renderOptionDetails(data);
                })
                .catch(function (error) {
                    console.error(error);
                    alert('옵션 정보를 불러오지 못했습니다.');
                });
        });
    })();

    function closeCartEditPopup() {
        const overlay = document.querySelector('.cart-edit-overlay');
        if (overlay) {
            overlay.remove();
        }
    }

    function validateCartEditForm() {
        const groupSelect  = document.getElementById('cartOptionGroupSelect');   // 색상
        const detailSelect = document.getElementById('cartOptionDetailSelect'); // 사이즈
        const qtyInput     = document.getElementById('cartEditQtyInput');

        // 색상 필수라면
        if (!groupSelect.value) {
            alert('색상을 선택해주세요.');
            groupSelect.focus();
            return false;
        }

        // 사이즈 필수
        if (!detailSelect.value) {
            alert('사이즈를 선택해주세요.');
            detailSelect.focus();
            return false;
        }

        // 수량 체크
        const raw = qtyInput.value;

        if (!raw) {
            alert('수량을 선택해주세요.');
            qtyInput.focus();
            return false;
        }

        const value = parseInt(raw, 10);

        if (isNaN(value) || value < 1) {
            alert('수량은 1개 이상이어야 합니다.');
            qtyInput.focus();
            return false;
        }

        // 여기까지 통과하면 서버로 전송
        return true;
    }
</script>
<script th:if="${errorMessage}" th:inline="javascript">
    alert([[${errorMessage}]]);
</script>
</body>
</html>
