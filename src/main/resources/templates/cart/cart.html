<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/cart-item-edit-popup.css}">
    <link rel="stylesheet" th:href="@{/css/cart.css}">
    <link rel="stylesheet" th:href="@{/css/cart-page.css}">
</head>
<body>

<!-- 공통 헤더 fragment -->
<div th:replace="fragments/header :: topHeader(${cartCount})"></div>

<main class="cart-page">

    <!-- ✅ 빈 장바구니 화면 -->
    <section class="empty-cart-wrapper"
             th:if="${cartInfo.totalCount == 0}">
        <div class="empty-cart-inner">
            <div class="empty-cart-icon">
                <span class="icon-cart">🛒</span>
            </div>
            <p class="empty-cart-main-text">장바구니가 비었습니다</p>
            <p class="empty-cart-sub-text">상품을 추가해보세요.</p>

            <a th:href="@{/products}" class="btn-primary">
                쇼핑 계속하기
            </a>
        </div>
    </section>

    <!-- ✅ 장바구니 리스트 + 주문 요약 -->
    <section class="cart-wrapper"
             th:if="${cartInfo.totalCount > 0}">

        <div class="cart-container">

            <!-- 왼쪽: 장바구니 목록 -->
            <div class="cart-items-area">
                <h2 class="cart-title">
                    장바구니
                    <span th:text="'(' + ${cartInfo.totalCount} + ')'">(0)</span>
                </h2>

                <!-- ✅ 선택 삭제 & 단건 삭제용 form -->
                <form th:action="@{/cart/items}" method="post" id="cartForm">
                    <input type="hidden" name="_method" value="delete">

                    <div class="cart-items-list">
                        <div class="cart-item-card"
                             th:each="item : ${cartInfo.cartItems}"
                             th:data-cart-item-id="${item.cartItemId}"
                             th:data-subtotal="${item.subtotalPrice}">

                            <!-- 체크박스 -->
                            <div class="cart-item-select">
                                <input type="checkbox"
                                       class="cart-item-checkbox"
                                       name="cartItemIds"
                                       th:value="${item.cartItemId}"
                                       checked="checked"
                                       th:disabled="${item.optionDetailInfo.soldOut}">
                            </div>

                            <!-- 상품 썸네일 -->
                            <div class="cart-item-thumbnail">
                                <img th:src="${item.productInfo.thumbnailUrl}"
                                     alt="상품 썸네일">
                            </div>

                            <!-- 중앙: 상품/옵션/가격 정보 -->
                            <div class="cart-item-info">
                                <!-- 상품명 -->
                                <div class="product-name"
                                     th:text="${item.productInfo.name}">
                                    상품명
                                </div>

                                <!-- 옵션 정보 -->
                                <div class="product-option">
                                    <span th:text="'색상/옵션: '
                                            + ${item.productOptionGroupInfo.name}
                                            + ' / '
                                            + ${item.optionDetailInfo.name}">
                                        옵션 정보
                                    </span>

                                    <!-- 품절 뱃지 -->
                                    <span class="badge-soldout"
                                          th:if="${item.optionDetailInfo.soldOut}">
                                        품절
                                    </span>
                                </div>

                                <!-- 가격 정보 -->
                                <div class="price-block">
                                    <div class="original-price"
                                         th:text="${#numbers.formatInteger(item.productInfo.price, 0, 'COMMA')} + '원'">
                                        45,000원
                                    </div>

                                    <div class="discount-rate"
                                         th:if="${item.productInfo.discountRate > 0}"
                                         th:text="${item.productInfo.discountRate} + '% 할인'">
                                        15% 할인
                                    </div>

                                    <div class="option-price">
                                        옵션 적용가:
                                        <span th:text="${#numbers.formatInteger(item.optionDetailInfo.optionAppliedUnitPrice, 0, 'COMMA')} + '원'">
                                            38,250원
                                        </span>
                                    </div>

                                    <div class="final-price">
                                        최종 가격:
                                        <span th:text="${#numbers.formatInteger(item.optionDetailInfo.saleUnitPrice, 0, 'COMMA')} + '원'">
                                            38,250원
                                        </span>
                                    </div>
                                </div>

                                <!-- 옵션 변경 버튼 -->
                                <div class="option-edit">
                                    <button type="button"
                                            class="btn-outline cart-option-edit-btn"
                                            th:data-cart-item-id="${item.cartItemId}">
                                        옵션 변경하기
                                    </button>
                                </div>
                            </div>

                            <!-- 오른쪽: 수량/소계/삭제 -->
                            <div class="cart-item-right">
                                <!-- 수량 표시 (읽기 전용) -->
                                <div class="quantity-display">
                                    수량:
                                    <span th:text="${item.quantity}">1</span>개
                                </div>

                                <!-- 소계 -->
                                <div class="item-subtotal">
                                    소계:
                                    <span th:text="${#numbers.formatInteger(item.subtotalPrice, 0, 'COMMA')} + '원'">
                                        76,500원
                                    </span>
                                </div>

                                <!-- 단건 삭제 버튼 -->
                                <button type="submit"
                                        class="delete-btn"
                                        th:formaction="@{/cart/items/{cartItemId}(cartItemId=${item.cartItemId})}"
                                        formmethod="post"
                                        title="장바구니에서 삭제">
                                    🗑
                                </button>
                            </div>

                        </div> <!-- /cart-item-card -->
                    </div> <!-- /cart-items-list -->

                    <!-- 선택 상품 삭제 버튼 -->
                    <div style="margin-top: 16px;">
                        <button type="submit" class="btn-outline">
                            선택 상품 삭제
                        </button>
                    </div>
                </form>
            </div>

            <!-- 오른쪽: 주문 요약 -->
            <aside class="order-summary-area">
                <div class="order-summary-card">
                    <h3>주문 요약</h3>

                    <div class="summary-row">
                        <span>선택한 상품</span>
                        <span><span id="selected-count">0</span>개</span>
                    </div>

                    <div class="summary-row">
                        <span>소계</span>
                        <span id="summary-subtotal">₩0</span>
                    </div>

                    <hr>

                    <div class="summary-row total-row">
                        <span>총 금액</span>
                        <span id="summary-total">₩0</span>
                    </div>

<!--
                    <button type="button" class="btn-primary summary-btn" disabled>
                        결제하기
                    </button>
-->
                    <form th:action="@{/orders/sheet}" method="post" id="orderSheetForm">
                        <!-- JS에서 선택된 cartItemIds를 여기 hidden input으로 채워줄 예정 -->
                        <div id="order-hidden-fields"></div>

                        <button type="button"
                                class="btn-primary summary-btn"
                                id="goOrderSheetBtn"
                                disabled>
                            결제하기
                        </button>
                    </form>

                    <a th:href="@{/products}" class="btn-text">
                        쇼핑 계속하기
                    </a>
                </div>
            </aside>

        </div> <!-- /cart-container -->

    </section>

</main>

<div id="cart-edit-popup-container"></div>

<!-- ===========================
   서버에서 message / errorMessage 내려온 경우 alert
=========================== -->
<script th:if="${message}" th:inline="javascript">
    alert([[${message}]]);
</script>

<script th:if="${errorMessage}" th:inline="javascript">
    alert([[${errorMessage}]]);
</script>

<script th:src="@{/js/cart-summary.js}" defer></script>
<script th:src="@{/js/cart-option-popup.js}" defer></script>

</body>
</html>
