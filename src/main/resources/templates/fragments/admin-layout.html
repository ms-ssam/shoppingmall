<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLANC Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }

        /* 사이드바 메뉴 스타일 */
        .nav-item {
            display: flex; align-items: center; padding: 12px 20px; color: #4b5563;
            text-decoration: none; transition: all 0.2s; font-size: 15px; font-weight: 500;
        }
        .nav-item:hover { background-color: #e5e7eb; color: #111; }
        .nav-item.active { background-color: #000; color: #fff; }
        .nav-item i { margin-right: 10px; font-size: 18px; }
    </style>
</head>
<body>

<header class="fixed top-0 left-0 w-full h-16 bg-black text-white z-50 flex items-center justify-between px-6 shadow-md">
    <div class="flex items-center w-64">
        <a th:href="@{/admin/products}" class="flex items-center gap-2 text-white no-underline hover:text-gray-300">
            <svg width="32" height="32" viewBox="0 0 100 100" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
                <path d="M 45,15 Q 50,10 55,15" />
                <line x1="35" y1="18" x2="65" y2="18" />
                <line x1="50" y1="20" x2="25" y2="75" />
                <line x1="50" y1="20" x2="75" y2="75" />
                <line x1="40" y1="50" x2="60" y2="50" />
            </svg>
            <span class="font-bold text-xl tracking-tight">BLANC ADMIN</span>
        </a>
    </div>

    <div class="flex-1 text-center">
        <h2 class="text-lg font-bold" th:text="${pageTitle} ?: '대시보드'">관리자 페이지</h2>
    </div>

    <div class="flex items-center gap-4">
        <a th:href="@{/}" class="text-sm font-medium hover:text-gray-300 flex items-center gap-1">
            <i class="bi bi-house"></i> 쇼핑몰 홈
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="text-sm font-medium hover:text-red-400 flex items-center gap-1">
                <i class="bi bi-box-arrow-right"></i> 로그아웃
            </button>
        </form>
    </div>
</header>

<div class="flex h-screen pt-16"> <aside class="w-64 bg-white border-r border-gray-200 h-full fixed left-0 overflow-y-auto pb-10">

    <div class="p-6 border-b border-gray-100 flex flex-col items-center justify-center bg-gray-50">
        <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center mb-3 text-gray-500">
            <i class="bi bi-person-fill text-3xl"></i>
        </div>
        <span class="font-bold text-gray-800" sec:authentication="name">AdminID</span>
        <span class="text-xs text-gray-500 mt-1">최고 관리자</span>
    </div>

    <nav class="mt-4 flex flex-col gap-1">
        <a th:href="@{/admin/products}" class="nav-item"
           th:classappend="${menu == 'product'} ? 'active'">
            <i class="bi bi-box-seam"></i> 상품 관리
        </a>
        <a th:href="@{/admin/orders}" class="nav-item"
           th:classappend="${menu == 'order'} ? 'active'">
            <i class="bi bi-receipt"></i> 주문 관리
        </a>
        <a href="#" class="nav-item"
           th:classappend="${menu == 'member'} ? 'active'"
           onclick="alert('준비 중입니다.'); return false;">
            <i class="bi bi-people"></i> 회원 관리(준비 중)
        </a>
        <a th:href="@{/admin/reviews}" class="nav-item"
           th:classappend="${menu == 'review'} ? 'active'">
            <i class="bi bi-chat-square-text"></i> 리뷰 관리
        </a>
        <a th:href="@{/admin/inquiries}" class="nav-item"
           th:classappend="${menu == 'inquiry'} ? 'active'">
            <i class="bi bi-question-circle"></i> 문의 관리 (QnA)
        </a>
        <a th:href="@{/admin/categories}" class="nav-item"
           th:classappend="${menu == 'category'} ? 'active'">
            <i class="bi bi-grid"></i> 카테고리 관리
        </a>
        <a href="#" class="nav-item"
           th:classappend="${menu == 'notice'} ? 'active'"
           onclick="alert('준비 중입니다.'); return false;">
            <i class="bi bi-megaphone"></i> 공지 관리(준비 중)
        </a>
        <a href="#" class="nav-item"
           th:classappend="${menu == 'banner'} ? 'active'"
           onclick="alert('준비 중입니다.'); return false;">
            <i class="bi bi-images"></i> 배너 관(준비 중)
        </a>
        <a href="#" class="nav-item" th:classappend="${menu == 'inventory'} ? 'active'"
           onclick="alert('준비 중입니다.'); return false;">
            <i class="bi bi-clipboard-data"></i> 재고 이력 관리(준비 중)
        </a>
    </nav>
</aside>

    <main class="flex-1 ml-64 p-8 overflow-y-auto bg-gray-50 h-full">
        <div th:replace="${content}"></div>
    </main>
</div>

</body>
</html>
