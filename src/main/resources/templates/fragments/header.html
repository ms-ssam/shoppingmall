<header th:fragment="topHeader(cartCount)" class="site-header" xmlns:sec="http://www.w3.org/1999/xhtml">

    <div class="black-header">
        <!-- [1] 왼쪽 영역 -->
        <div class="header-left">
            <a th:href="@{/}" class="logo">
                <svg width="32" height="32" viewBox="0 0 100 100"
                     fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
                    <path d="M 45,15 Q 50,10 55,15" />
                    <line x1="35" y1="18" x2="65" y2="18" />
                    <line x1="50" y1="20" x2="25" y2="75" />
                    <line x1="50" y1="20" x2="75" y2="75" />
                    <line x1="40" y1="50" x2="60" y2="50" />
                </svg>
                <span>BLANC</span>
            </a>

            <nav class="nav-menu">
                <a th:href="@{/products}">SHOP</a>
                <a href="#" onclick="alert('준비 중입니다.'); return false;">NOTICE</a>
            </nav>
        </div>

        <!-- [2] 중앙 검색 영역 -->
        <div class="header-center">
            <form th:action="@{/products}" method="get" class="search-form" id="headerSearchForm">
                <input type="text"
                       name="keyword"
                       id="headerSearchInput"
                       class="search-input"
                       placeholder="상품명, 카테고리 등 입력 (최소 2글자)"
                       th:value="${param.keyword}">
                <button type="submit" class="search-btn">
                    <span>🔍</span>
                    <span>검색</span>
                </button>
            </form>
        </div>

        <!-- [3] 오른쪽 영역 -->
        <div class="header-right">
            <div class="auth-menu">

                <!-- 비로그인 -->
                <div class="auth-links" sec:authorize="isAnonymous()">
                    <a th:href="@{/login}">LOGIN</a>
                    <a th:href="@{/signup}">SIGNUP</a>
                </div>

                <!-- 로그인 -->
                <div class="auth-links" sec:authorize="isAuthenticated()">

                    <!-- 관리자 전용 버튼 -->
                    <a th:href="@{/admin/products}"
                       class="admin-btn"
                       sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-gear-fill"></i>
                        <span>ADMIN MODE</span>
                    </a>

                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" class="logout-btn">LOGOUT</button>
                    </form>

                    <a th:href="@{/mypage}">MY</a>
                </div>

                <!-- CART (로그인/비로그인 공통) -->
                <a th:href="@{/cart}" class="cart-link">
                    CART(<span th:text="${cartCount} ?: 0">0</span>)
                </a>
            </div>
        </div>
    </div>
    <!-- ✅ 검색 검증 JavaScript -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('headerSearchForm');
            var input = document.getElementById('headerSearchInput');

            if (form && input) {
                form.addEventListener('submit', function(e) {
                    var keyword = input.value.trim();

                    // 빈 검색어는 허용 (전체 검색)
                    if (keyword === '') {
                        return true;
                    }

                    // 2글자 미만 검증
                    if (keyword.length < 2) {
                        e.preventDefault(); // 폼 제출 중단
                        alert('⚠️ 검색어는 최소 2글자 이상 입력해주세요.');
                        input.focus();
                        return false;
                    }
                    return true;
                });
            }
        });
    </script>
</header>
