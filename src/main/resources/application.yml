spring:
  profiles:
    active: local
  application:
    name: shoppingMall
  thymeleaf:
    cache: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true  # PUT, DELETE 요청 hidden-method 지원

  datasource:
    url: jdbc:mysql://localhost:3306/team1shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: team1
    password: passw0rd

  jpa:
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    try-it-out-enabled: true

    # .