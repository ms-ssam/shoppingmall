spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  sql:
    init:
      mode: never  # 테스트에서 data.sql 안 타게

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

