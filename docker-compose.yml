version: '3.8'
services:
  redis:
    image: redis:latest
    container_name: shoppingMall-redis
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: shoppingMall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
